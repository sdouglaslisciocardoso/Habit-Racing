<style>
:root{--bg:#0b0b0e;--p:#141418;--p2:#1c1c21;--bd:#2a2a31;--tx:#f3f3f5;--mu:#8e8e99;--acc:#ffd400;--acc2:#ff2d3d;--onacc:#111;--ok:#1fe08a;--bad:#ff2d3d;--am:#ffc400;--red:var(--bad);--gr:var(--ok);--rad:18px;--brad:999px;--ff:Bahnschrift,'DIN Alternate',-apple-system,'SF Pro Display','Segoe UI',system-ui,sans-serif;--fn:var(--ff);
--bgx:radial-gradient(640px 360px at 88% -8%,#ff2d3d26,transparent),repeating-linear-gradient(45deg,#0d0d10 0 3px,#121216 3px 6px);--cut:none;--par:none}
:root[data-theme=pitwall]{--bg:#04070c;--p:#060c16;--p2:#0a1424;--bd:#16263d;--tx:#dbe6f3;--mu:#6a7f99;--acc:#22d3ee;--acc2:#c084fc;--onacc:#04070c;--ok:#34e89e;--bad:#ff4d6d;--am:#facc15;--rad:10px;--brad:6px;--fn:ui-monospace,'SF Mono',Menlo,'DejaVu Sans Mono',monospace;--bgx:linear-gradient(#0a1220 1px,transparent 1px) 0 0/100% 28px}
:root[data-theme=noturno]{--bg:#06060f;--p:#0e0f1d;--p2:#15172b;--bd:#262a48;--tx:#eef0ff;--mu:#8a90b8;--acc:#ff7a1a;--acc2:#4f7cff;--onacc:#170900;--ok:#2ee6a8;--bad:#ff4766;--am:#ffb347;--rad:22px;--brad:999px;--bgx:radial-gradient(700px 420px at 0% -10%,#4f7cff33,transparent),radial-gradient(520px 320px at 100% 0%,#ff7a1a26,transparent)}
*{box-sizing:border-box;margin:0}
body{font:16px/1.45 var(--ff);color:var(--tx);min-height:100vh;background:var(--bgx),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
input,textarea{background:var(--well);border:1px solid var(--bd);border-radius:calc(var(--rad)*.6);padding:11px 12px;min-width:0;flex:1}
input:focus-visible,button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* cabeçalho com faixa de pintura */
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:nowrap;padding:calc(10px + env(safe-area-inset-top)) 20px 12px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:linear-gradient(var(--acc),var(--acc)) 0 0/100% 4px no-repeat,linear-gradient(var(--stripe),var(--stripe)) 0 5px/100% 1px no-repeat;opacity:.95}
:root[data-theme=pitwall] header::after{background:var(--bd);height:1px;bottom:0}
:root[data-theme=noturno] header::after{background:linear-gradient(90deg,transparent,var(--acc2),var(--acc),transparent);height:2px;bottom:0}
.hbt{display:flex;gap:8px;flex:none}.hbt .b{width:44px;height:44px;padding:0;display:grid;place-items:center;font-size:18px}
.lg{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:900;font-style:italic;font-size:22px;letter-spacing:.03em}.lg b{color:var(--acc2);margin:0 3px}
:root[data-theme=pitwall] .lg{font-family:var(--fn);font-style:normal;letter-spacing:.08em;font-size:18px}:root[data-theme=pitwall] .lg b{color:var(--acc)}
.chip{padding:3px 12px;background:var(--c);color:#111;font-weight:800;font-size:13px;letter-spacing:.08em;border-radius:var(--brad);clip-path:var(--par)}
/* abas */
nav{display:flex;gap:8px;padding:18px 20px 0;max-width:980px;margin:auto;overflow-x:auto}
nav button{background:color-mix(in srgb,var(--tx) 5%,transparent);border:0;padding:11px 20px;cursor:pointer;white-space:nowrap;font-weight:700;border-radius:var(--brad);clip-path:var(--par);transition:.2s;color:var(--mu)}
nav button.on{background:var(--acc);color:var(--onacc)}
:root[data-theme=pitwall] nav button{font-family:var(--fn);text-transform:uppercase;font-size:13px;letter-spacing:.06em}
main{max-width:980px;margin:auto;padding:16px 20px 70px;display:grid;gap:14px}
/* cartões */
.c{position:relative;background:linear-gradient(160deg,var(--p2),var(--p));border:1px solid var(--bd);padding:20px;border-radius:var(--rad);clip-path:var(--cut)}
.c::before{content:"";position:absolute;left:20px;top:0;width:44px;height:4px;border-radius:0 0 4px 4px;background:var(--acc)}
:root[data-theme=pitwall] .c::before,:root[data-theme=noturno] .c::before{display:none}
:root[data-theme=noturno] .c{background:linear-gradient(160deg,color-mix(in srgb,var(--tx) 5%,transparent),color-mix(in srgb,var(--tx) 2%,transparent));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
summary{cursor:pointer;font-weight:700;font-size:18px}details[open] summary{margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.b{background:var(--acc);color:var(--onacc);border:0;padding:12px 22px;font-weight:800;cursor:pointer;border-radius:var(--brad);clip-path:var(--par);transition:filter .2s,transform .2s}
.b:hover{filter:brightness(1.1);transform:translateY(-1px)}.b.gr{background:var(--ok);color:#04170d}.b.ghost{background:color-mix(in srgb,var(--tx) 7%,transparent);color:var(--tx)}
:root[data-theme=noturno] .b:not(.ghost){box-shadow:0 6px 24px color-mix(in srgb,var(--acc) 45%,transparent)}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:17px;padding:6px}.x:hover{color:var(--acc)}
.mu{color:var(--mu)}.sm{font-size:14px}
/* painel de instrumentos */
.dash{padding-top:16px;text-align:center}
.leds{display:flex;gap:6px;justify-content:center;margin-bottom:6px}.leds i{width:min(26px,7vw);height:10px;border-radius:5px;background:color-mix(in srgb,var(--tx) 8%,transparent)}
.leds i.g{background:var(--ok);box-shadow:0 0 10px var(--ok)}.leds i.y{background:var(--am);box-shadow:0 0 10px var(--am)}.leds i.r{background:var(--bad);box-shadow:0 0 10px var(--bad)}
.tach{position:relative;width:min(300px,78vw);margin:0 auto}.tach svg{width:100%;display:block}
.tk{stroke:color-mix(in srgb,var(--tx) 8%,transparent)}.tc{position:absolute;left:0;right:0;top:30%;text-align:center}.tc b{display:block;font-weight:900;font-style:italic;font-size:clamp(60px,18vw,78px);line-height:1;font-family:var(--fn)}.tc small{color:var(--mu);font-size:12px;letter-spacing:.2em}
.side{display:flex;justify-content:space-between;margin-top:-26px;padding:0 4px}.side div{min-width:80px}.side b{display:block;font-weight:900;font-style:italic;font-size:26px;font-family:var(--fn)}.side small{font-size:11px;letter-spacing:.18em;color:var(--mu)}
:root[data-theme=pitwall] .tc b,:root[data-theme=pitwall] .side b{font-style:normal;color:var(--acc)}

.h{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;background:color-mix(in srgb,var(--tx) 3%,transparent);border:1px solid var(--bd);border-radius:calc(var(--rad)*.9);margin-bottom:10px;transition:opacity .3s}.h:last-child{margin:0}
.h.d{opacity:.55}.h.d b{text-decoration:line-through}.hi{flex:1;min-width:0}.hi small{display:block;color:var(--mu)}
.hr{font-weight:900;font-style:italic;color:var(--acc2);font-family:var(--fn)}:root[data-theme=pitwall] .hr{font-style:normal;color:var(--acc)}
.hi b{display:block;overflow-wrap:anywhere}
.tm{font-weight:900;font-style:italic;font-size:20px;font-variant-numeric:tabular-nums;color:var(--acc2);font-family:var(--fn)}

.ck{width:50px;height:50px;border-radius:calc(var(--rad)*.75);border:2px solid var(--bd);background:var(--well);cursor:pointer;font-size:22px;flex:none;transition:.25s;color:var(--onacc)}.ck:hover{border-color:var(--acc);transform:scale(1.06)}.ck.on{background:var(--acc);border-color:var(--acc)}
.ck.qt{font-size:14px;font-weight:900;color:var(--acc);border-color:var(--acc);font-family:var(--fn)}
.ck.sm{width:30px;height:30px;font-size:15px;border-radius:8px}
.tb{padding:6px 14px;font-size:14px;margin-top:6px}
/* topo */
#hero,#st{max-width:980px;margin:16px auto 0;padding:0 20px}#hero:empty{display:none}
#st{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}
.tl{background:linear-gradient(160deg,var(--p2),var(--p));border:1px solid var(--bd);border-top:4px solid var(--acc);border-radius:calc(var(--rad)*.8);padding:10px 14px;display:grid;gap:3px;align-content:start}.tl b{font-size:24px;font-weight:900;font-style:italic;line-height:1.1;font-family:var(--fn)}.tl small{font-size:13px}.tl .pb{height:6px}
:root[data-theme=pitwall] .tl{border-top-width:1px}:root[data-theme=pitwall] .tl b{font-style:normal}
.hero{overflow:hidden;padding-right:26%}
.hero::after{content:"";position:absolute;top:-20%;right:-12%;width:34%;height:150%;transform:skewX(-18deg);background:linear-gradient(90deg,var(--acc) 0 74%,transparent 74% 80%,var(--stripe) 80% 86%,transparent 86%);opacity:.95;pointer-events:none}
.hero p{font-size:clamp(21px,5.4vw,28px);line-height:1.22;font-weight:900;font-style:italic;margin:6px 0 14px;position:relative}
.hero small,.hero .row,.hero details{position:relative;z-index:1}
:root[data-theme=pitwall] .hero{padding-right:20px;border-color:#1d3655;background:#081322}:root[data-theme=pitwall] .hero::after{display:none}:root[data-theme=pitwall] .hero p{font-style:normal;font-weight:500;font-size:clamp(18px,4.6vw,22px)}:root[data-theme=pitwall] .hero>small{color:var(--acc);font-family:var(--fn);letter-spacing:.14em;text-transform:uppercase}
:root[data-theme=noturno] .hero{padding-right:20px;background:linear-gradient(135deg,#ff7a1a26,#4f7cff1f)}:root[data-theme=noturno] .hero::after{display:none}
/* semana, gráficos, vícios */
.sc{overflow-x:auto}.wk{width:100%;border-collapse:collapse;min-width:540px}.wk th,.wk td{padding:8px;text-align:center}.wk th small,.hn small{display:block;color:var(--mu);font-weight:400}.wk th.td{color:var(--acc)}.hn{text-align:left!important}
.cell{width:42px;height:42px;border-radius:calc(var(--rad)*.5);border:1px solid var(--bd);background:var(--well);cursor:pointer;font-size:18px}.cell.on{background:var(--ok)}.cell:disabled{opacity:.3;cursor:default}.cell.sl{border-color:var(--acc);color:var(--acc)}.no{color:var(--bd);font-style:normal}
.bars{display:flex;gap:10px}.bar{flex:1;text-align:center}.col{height:110px;display:flex;align-items:flex-end}.col i{width:100%;border-radius:6px 6px 0 0;background:linear-gradient(var(--acc),var(--acc2));min-height:3px;transition:height .6s}.bar span{font-size:13px;color:var(--mu)}
.vg{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}.vc{display:grid;gap:6px}.vt{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:700}
.big{font-size:68px;font-weight:900;font-style:italic;line-height:1.05;color:var(--ok);font-variant-numeric:tabular-nums;font-family:var(--fn)}.big small{font-size:20px;margin-left:10px;font-style:normal;color:var(--mu);font-family:var(--ff)}
.clk{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin:-2px 0 4px;font-family:var(--fn)}
.pb{height:10px;border-radius:9px;background:var(--well);overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--acc));transition:width .6s}
.chs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.ch input{display:none}
.ch span,.ch2{display:inline-block;padding:7px 14px;border-radius:999px;border:1px solid var(--bd);cursor:pointer;background:var(--well)}.ch input:checked+span{background:var(--acc);border-color:var(--acc);color:var(--onacc)}.ch2{margin:6px 6px 0 0}.ch2:hover{border-color:var(--acc)}.ch2.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.chat{max-height:48vh;overflow:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}.m{padding:10px 14px;border-radius:14px;max-width:88%}.m.user{align-self:flex-end;background:var(--acc);color:var(--onacc)}.m.assistant{background:color-mix(in srgb,var(--tx) 6%,transparent);border:1px solid var(--bd)}
/* comemorações e avisos */
.ov{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:50}
.ov.full{background:radial-gradient(circle,#000a,#000f);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);text-align:center;align-content:center;gap:6px;animation:in .3s}
.ov h1{font-size:clamp(90px,22vw,190px);font-style:italic;font-weight:900;line-height:1;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.fl{width:min(70vw,420px);height:200px;background:conic-gradient(#fff 25%,#000 0 50%,#fff 0 75%,#000 0) 0 0/50px 50px;animation:wave 1s infinite ease-in-out;border-radius:6px}
.mini,.toast{position:fixed;left:50%;transform:translateX(-50%);z-index:300;animation:drop .4s cubic-bezier(.2,1.4,.4,1)}
.mini{top:86px;background:var(--acc);color:var(--onacc);padding:12px 26px;font-weight:800;border-radius:var(--brad);clip-path:var(--par)}
.toast{bottom:100px;background:color-mix(in srgb,var(--p) 94%,transparent);border:1px solid var(--acc);padding:12px 18px;border-radius:12px;max-width:90vw;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
@keyframes in{from{opacity:0}}@keyframes drop{from{opacity:0;transform:translate(-50%,-24px)}}@keyframes wave{50%{transform:rotate(3deg) skewY(-3deg)}0%,100%{transform:rotate(-3deg) skewY(3deg)}}
.md{position:fixed;inset:0;background:#000b;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:70;padding:20px;overflow:auto}.md .c{width:min(520px,100%)}
.nt{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--bd)}.nt .hi span{overflow-wrap:anywhere}.nt.d .hi span{text-decoration:line-through;opacity:.55}.ni{font-size:20px;line-height:1.3}
nav button .ic{margin-right:6px}
#tmr{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:8;align-items:center;gap:10px;background:color-mix(in srgb,var(--p) 95%,transparent);border:1px solid var(--acc);padding:10px 14px;border-radius:18px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 10px 40px #000a;width:min(560px,calc(100% - 24px))}
.tmi{flex:1;min-width:0}.tmi small{display:block;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tmi b{font-size:34px;font-style:italic;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1;font-family:var(--fn)}
body.tr main{padding-bottom:250px}
.fg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pos{color:var(--ok)}.neg{color:var(--bad)}
.cr{margin-top:12px}.cn{display:flex;justify-content:space-between;gap:10px}.cn small{color:var(--mu);font-weight:400}.lr{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--bd)}.lr span{overflow-wrap:anywhere}.lr small{display:block;color:var(--mu)}
.mood{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}.mood span{margin-right:4px}.mood button{font-size:24px;background:var(--well);border:1px solid var(--bd);border-radius:12px;padding:4px 8px;cursor:pointer;opacity:.55;transition:.2s}.mood button.on{opacity:1;border-color:var(--acc);background:color-mix(in srgb,var(--acc) 15%,transparent);transform:scale(1.1)}
.hm{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin:12px 0 8px;max-width:520px}.hm i{aspect-ratio:1;border-radius:3px}
/* seletor de tema */
.thg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 18px}
.thb{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;border:2px solid var(--bd);background:var(--well);cursor:pointer;font-weight:700;text-align:left}.thb.on{border-color:var(--acc)}
.sw{width:38px;height:38px;border-radius:10px;flex:none;border:1px solid color-mix(in srgb,var(--tx) 13%,transparent)}
/* celular: barra flutuante */
@media(max-width:700px){
.lg{font-size:19px}.h{gap:10px}.h .x{padding:4px;font-size:16px}

nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:64px;padding:6px 0;font-size:12px;font-weight:700;line-height:1.1;clip-path:none;border-radius:20px;background:none}
nav button .ic{font-size:27px;line-height:1;margin:0}
nav button.on{background:var(--acc);color:var(--onacc)}
:root[data-theme=pitwall] nav{border-radius:12px}:root[data-theme=pitwall] nav button{font-size:10.5px;border-radius:8px}
main{padding-bottom:160px}.toast{bottom:calc(178px + env(safe-area-inset-bottom))}#tmr{bottom:calc(96px + env(safe-area-inset-bottom))}
.fg{grid-template-columns:1fr}#st{gap:8px}.tl{padding:8px 10px}.tl b{font-size:20px}.hero{padding-right:20px}.hero::after{width:22%;right:-14%;opacity:.9}}
/* ===== botões e organização (clean) ===== */
:root{--brad:14px}:root[data-theme=pitwall]{--brad:8px}:root[data-theme=noturno]{--brad:14px}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:var(--brad);font-weight:700;font-size:15px;letter-spacing:.01em;clip-path:none!important;box-shadow:none}
.b .i{width:18px;height:18px}.b:hover{transform:none;filter:brightness(1.08)}.b:active{transform:scale(.97)}
.b.sm{height:36px;padding:0 14px;font-size:14px}.b.wide{width:100%;margin-top:14px;height:auto;min-height:46px;padding:10px 18px;line-height:1.25}
:root[data-theme] .b.t,:root[data-theme] .b.ghost{background:color-mix(in srgb,var(--tx) 7%,transparent);color:var(--tx);border:1px solid var(--bd)}
:root[data-theme] .b.gr{background:var(--ok);color:#04170d}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--bd);background:color-mix(in srgb,var(--tx) 6%,transparent);color:var(--tx);cursor:pointer;flex:none;transition:transform .15s,background .2s;padding:0}
.ib.g{border-color:transparent;background:none;color:var(--mu)}.ib.sm{width:32px;height:32px;border-radius:10px}.ib.sm .i{width:17px;height:17px}.ib.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}.ib:active{transform:scale(.92)}
.lnk{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:8px;background:none;border:0;color:var(--mu);font-weight:600;padding:12px;cursor:pointer}.lnk.dng{color:var(--bad)}.lnk .i{width:17px;height:17px}
.pill{display:inline-flex;align-items:center;gap:6px;margin-top:8px;height:30px;padding:0 12px;border-radius:999px;border:0;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);font-weight:700;font-size:13px;cursor:pointer}.pill .i{width:11px;height:11px}
.fab{position:fixed;right:24px;bottom:28px;z-index:7;width:60px;height:60px;border-radius:20px;border:0;background:var(--acc);color:var(--onacc);place-items:center;box-shadow:0 12px 30px #0009;cursor:pointer;transition:transform .15s}.fab:active{transform:scale(.92)}.fab .i{width:28px;height:28px;stroke-width:2.6}
body.tr .fab{bottom:118px}

.pill.mn{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);height:auto;min-height:30px;padding:5px 12px;text-align:left}

.set.tg{flex-direction:row-reverse;justify-content:space-between}
/* ===== temas femininos esportivos ===== */
:root{--well:#0000004d;--stripe:#fff;color-scheme:dark}
:root[data-theme=rose]{--bg:#0c0a0f;--p:#15121a;--p2:#1d1924;--bd:#2e2836;--tx:#fff4fa;--mu:#a99cb0;--acc:#ff2e88;--acc2:#a855f7;--onacc:#fff;--ok:#2ee6a6;--bad:#ff4d6d;--am:#ffcf4d;--stripe:#fff;--rad:16px;--brad:12px;--bgx:radial-gradient(640px 360px at 88% -8%,#ff2e8833,transparent),radial-gradient(520px 320px at 0% 40%,#a855f71c,transparent),repeating-linear-gradient(45deg,#0e0c12 0 3px,#131018 3px 6px)}
:root[data-theme=perola]{--bg:#f4f3f7;--p:#ffffff;--p2:#fbfafd;--bd:#e2dfe8;--tx:#14111a;--mu:#6d6676;--acc:#e6007e;--acc2:#6d28d9;--onacc:#fff;--ok:#0fae7a;--bad:#e11d48;--am:#f59e0b;--well:#f0eef4;--stripe:#6d28d9;--rad:14px;--brad:12px;--bgx:radial-gradient(760px 420px at 100% -12%,#ffd1e8,transparent),radial-gradient(620px 380px at -10% 30%,#e4dcff,transparent);color-scheme:light}
:root[data-theme=lavanda]{--bg:#06050c;--p:#0f0d19;--p2:#161328;--bd:#2a2547;--tx:#f3f0ff;--mu:#9a94c2;--acc:#b26bff;--acc2:#ff3dad;--onacc:#12071f;--ok:#34e8b0;--bad:#ff4d79;--am:#ffd166;--stripe:#ff3dad;--rad:14px;--brad:10px;--bgx:radial-gradient(700px 420px at 0% -10%,#b26bff38,transparent),radial-gradient(520px 320px at 100% 0%,#ff3dad2a,transparent),linear-gradient(#b26bff0d 1px,transparent 1px) 0 0/100% 30px}
:root[data-theme=champagne]{--bg:#eff7f7;--p:#ffffff;--p2:#f8fcfc;--bd:#d6e7e7;--tx:#0d1d20;--mu:#5d7275;--acc:#0bb3a5;--acc2:#ff4f9a;--onacc:#fff;--ok:#10a37f;--bad:#e5385f;--am:#f2a33a;--well:#ecf5f5;--stripe:#ff4f9a;--rad:14px;--brad:12px;--bgx:radial-gradient(720px 420px at 95% -10%,#bff0eb,transparent),radial-gradient(560px 360px at 0% 15%,#ffd6e7,transparent);color-scheme:light}
:root[data-theme=perola] .c,:root[data-theme=champagne] .c{box-shadow:0 8px 26px #10203012}
:root[data-theme=perola] .lgi,:root[data-theme=champagne] .lgi{box-shadow:0 2px 10px #0002}
:root[data-theme=lavanda] .c{background:linear-gradient(160deg,color-mix(in srgb,var(--tx) 6%,transparent),color-mix(in srgb,var(--tx) 2%,transparent));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
:root[data-theme=lavanda] .b:not(.t):not(.ghost),:root[data-theme=lavanda] .fab,:root[data-theme=lavanda] nav button.on,:root[data-theme=rose] .fab,:root[data-theme=rose] nav button.on{box-shadow:0 0 22px color-mix(in srgb,var(--acc) 50%,transparent)}
:root[data-theme=lavanda] header::after{background:linear-gradient(90deg,var(--acc),var(--acc2));height:2px;bottom:0;box-shadow:0 0 12px var(--acc)}
:root[data-theme=lavanda] .hero::after{background:linear-gradient(90deg,var(--acc) 0 70%,transparent 70% 78%,var(--acc2) 78% 86%,transparent 86%)}
:root[data-theme=rose] .lg b,:root[data-theme=perola] .lg b,:root[data-theme=lavanda] .lg b,:root[data-theme=champagne] .lg b{color:var(--acc)}
/* ===== painel digital ===== */
.dg{padding:2px 0 4px}
.rev{display:flex;gap:3px;align-items:flex-end;height:40px;padding:0 6px;transform:skewX(-14deg)}
.rev i{flex:1;border-radius:2px;background:color-mix(in srgb,var(--tx) 9%,transparent)}
.rev i.g{background:var(--ok);box-shadow:0 0 8px var(--ok)}.rev i.y{background:var(--am);box-shadow:0 0 8px var(--am)}.rev i.r{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.dgs{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--bd);border-radius:calc(var(--rad)*.8);background:var(--well);overflow:hidden;position:relative}
.dgs::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,color-mix(in srgb,var(--tx) 3%,transparent) 3px 4px);pointer-events:none}
.dgs>div{padding:12px 10px 10px;text-align:center}.dgs>div+div{border-left:1px solid var(--bd)}
.dgs small{display:block;font-size:11px;letter-spacing:.18em;color:var(--mu)}
.dgs b{display:block;font-weight:900;font-style:italic;font-size:clamp(46px,13vw,62px);line-height:1.05;font-family:var(--fn);font-variant-numeric:tabular-nums}
.dgs b.pcv{color:var(--acc)}.dgs b span{font-size:.45em;margin-left:2px}
/* ===== painel anel (velocímetro) ===== */
.ring{position:relative;width:min(270px,74vw);margin:-4px auto 0}.ring svg{width:100%;display:block}
.ring .tko{stroke:color-mix(in srgb,var(--tx) 12%,transparent)}
.ring .ndl{filter:drop-shadow(0 0 6px var(--acc))}
.ring .rtc{position:absolute;left:0;right:0;top:36%;text-align:center}.ring .rtc b{display:block;font-weight:900;font-style:italic;font-size:clamp(50px,15vw,66px);line-height:1;font-family:var(--fn)}.ring .rtc small{color:var(--mu);font-size:12px;letter-spacing:.2em}
/* ===== escolha de ícone ===== */
.icg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.icb{display:grid;gap:6px;justify-items:center;padding:10px 6px;border-radius:14px;border:2px solid var(--bd);background:var(--well);cursor:pointer;color:var(--tx);font:inherit;font-size:12.5px;font-weight:700}.icb img{width:58px;height:58px;border-radius:14px}.icb.on{border-color:var(--acc)}
.icx{margin-top:12px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--acc) 8%,var(--p));border:1px solid color-mix(in srgb,var(--acc) 30%,transparent);font-size:14px;line-height:1.45}.icx ol{margin:6px 0 0;padding-left:20px;display:grid;gap:4px}
/* ===== boas-vindas ===== */
.onb{position:fixed;inset:0;z-index:100;background:var(--bgx),var(--bg);display:grid;place-items:center;padding:28px 20px calc(28px + env(safe-area-inset-bottom));overflow:auto;animation:in .3s}
.onc{width:min(460px,100%);text-align:center;display:grid;gap:14px}
.onl{width:88px;height:88px;border-radius:24px;margin:0 auto 4px;box-shadow:0 12px 34px #0006}
.onc h2{font-size:27px;font-weight:900;font-style:italic;line-height:1.15}
.onc>p{line-height:1.45}
.ong{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.onbb{display:grid;gap:8px;justify-items:center;padding:18px 10px;border-radius:22px;border:2px solid var(--bd);background:var(--p2);color:var(--tx);cursor:pointer;font:inherit;transition:transform .15s,border-color .2s}.onbb b{font-size:17px}.onbb small{font-size:13px}.onbb:active{transform:scale(.97)}.onbb.on{border-color:var(--acc)}
.onsw{width:76px;height:76px;border-radius:22px;border:1px solid color-mix(in srgb,var(--tx) 18%,transparent)}
/* ===== ciclo ===== */
.cyr{display:flex;align-items:center;gap:18px}.cyr svg{width:128px;height:128px;flex:none}.cyr .cyt{display:grid;gap:4px}.cyr .cyt b{font-size:22px;font-weight:900}
.cyk{fill:none;stroke:color-mix(in srgb,var(--tx) 9%,transparent)}.cyv{fill:none;stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset .6s}
.syc{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.syc .ch2{margin:0;font-size:14px;padding:6px 12px}
.cyh{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(max-width:700px){
.fab{right:16px;bottom:calc(100px + env(safe-area-inset-bottom))}body.tr .fab{bottom:calc(178px + env(safe-area-inset-bottom))}
nav button .ic{margin:0}nav button .ic .i{width:25px;height:25px}
.md{align-items:end;padding:0}.md .c{width:100%;border-radius:26px 26px 0 0;clip-path:none;padding:26px 18px calc(22px + env(safe-area-inset-bottom));animation:up .25s ease-out}
:root[data-theme] .md .c::before{display:block;left:50%;transform:translateX(-50%);top:9px;bottom:auto;width:40px;height:5px;border-radius:3px;background:var(--bd)}
.ds b{font-size:21px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#gdb.spin .i{animation:gspin 1s linear infinite}@keyframes gspin{to{transform:rotate(360deg)}}#lock input{flex:none}select{background:var(--well);border:1px solid var(--bd);border-radius:calc(var(--rad)*.6);padding:9px 10px;color:inherit;font:inherit}

/* ===== ajustes agrupados ===== */
.grp{border:1px solid var(--bd);border-radius:calc(var(--rad)*.8);background:var(--well);margin-top:10px;overflow:hidden}
.grp>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;-webkit-tap-highlight-color:transparent}.grp>summary::-webkit-details-marker{display:none}
.grp .gi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc);flex:none}.grp .gi .i{width:20px;height:20px}
.grp .gt{flex:1;min-width:0;display:grid;gap:2px}.grp .gt b{font-size:16px;font-weight:800}.grp .gt small{color:var(--mu);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp .gc{color:var(--mu);transition:transform .2s}.grp[open] .gc{transform:rotate(90deg)}
.grp .gb{padding:0 14px 16px;border-top:1px solid var(--bd)}.grp .gb>h4:first-child,.grp .gb>.set:first-child{margin-top:12px}
.sheet .grp h4{margin:18px 0 8px}
.ver{text-align:center;color:var(--mu);font-size:12px;margin:18px 0 4px;letter-spacing:.04em}.ver a{color:inherit}
details.adv{margin-top:10px}details.adv>summary,details.icx>summary{cursor:pointer;color:var(--mu);font-size:13px;font-weight:700;list-style:none}details.adv>summary::-webkit-details-marker,details.icx>summary::-webkit-details-marker{display:none}
details.adv>summary::before,details.icx>summary::before{content:'›';display:inline-block;margin-right:6px;transition:transform .2s}details.adv[open]>summary::before,details.icx[open]>summary::before{transform:rotate(90deg)}
details.icx>summary{color:var(--tx)}
#lkp:placeholder-shown,#psf input:placeholder-shown{letter-spacing:normal!important;font-size:17px!important}
.kbt{background:none;border:0;color:var(--mu);font-size:13px;font-weight:700;text-decoration:underline;cursor:pointer;justify-self:center;padding:6px;margin-top:2px}#psf .kbt{display:block;margin:6px auto 0}
.chv{display:grid;gap:3px;width:100%;text-align:left;padding:14px;margin-top:10px;border-radius:14px;border:2px solid var(--bd);background:var(--well);cursor:pointer;color:inherit}.chv b{font-size:16px}.chv small{color:var(--mu);font-size:13px}.chv em{font-style:normal;color:var(--ok);font-size:12px;font-weight:800}.chv:hover{border-color:var(--acc)}

/* ===== hábitos de hoje (cartões grandes) ===== */
.hbl{display:grid;gap:10px}

'use strict';

const GID='1084181239561-43t77l64li8nh7q1fa902ndj9fofae5t.apps.googleusercontent.com',GSC='https://www.googleapis.com/auth/drive.appdata',GFN='habit-rc.json',KIT=1000000;
const te8=new TextEncoder(),td8=new TextDecoder();
const b64e=u=>{let s='';new Uint8Array(u).forEach(c=>s+=String.fromCharCode(c));return btoa(s)};
const b64d=s=>Uint8Array.from(atob(String(s)),c=>c.charCodeAt(0));
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
const lsG=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsS=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},lsD=k=>{try{localStorage.removeItem(k)}catch(e){}};
const hx=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- limpeza de dados (protege contra arquivos/backup adulterados) ---------- */
const DR=/^\d{4}-\d\d-\d\d$/,TR=/^\d\d:\d\d$/,MR=/^\d{4}-\d\d$/;
function clean(d){
  if(!d||typeof d!='object'||Array.isArray(d)||!Array.isArray(d.h))return null;
  const num=(v,f)=>{v=Number(v);return isFinite(v)?v:f},obj=o=>o&&typeof o=='object'&&!Array.isArray(o);
  let seq=Date.now();
  ['h','v','n','bl','sh','yd','cl','rn'].forEach(k=>{d[k]=(Array.isArray(d[k])?d[k]:[]).filter(obj).map(x=>(x.id=num(x.id,++seq),x))});
  d.h.forEach(h=>{h.n=String(h.n==null?'':h.n);if(!TR.test(h.t))h.t='08:00';h.d=Array.isArray(h.d)?h.d.map(Number).filter(x=>x>=0&&x<7):[];if(h.dt!=null&&!DR.test(h.dt))delete h.dt;['q','tm'].forEach(k=>{if(h[k]!=null){const v=num(h[k],0);if(v>0)h[k]=v;else delete h[k]}})});
  d.v.forEach(v=>{v.s=num(v.s,Date.now());v.g=num(v.g,30)});d.n.forEach(m=>{if(m.hr!=null&&!TR.test(m.hr))delete m.hr});if(d.pl!=null)d.pl=num(d.pl,10);
  d.bl.forEach(b=>{b.v=num(b.v,0);b.dia=num(b.dia,1)});
  d.cl.forEach(c=>{c.n=String(c.n==null?'':c.n);c.v=num(c.v,0);if(!Array.isArray(c.log))c.log=[];if(c.nx&&!DR.test(c.nx))c.nx=''});d.rn.forEach(r=>{r.t=String(r.t==null?'':r.t);if(!DR.test(r.d))r.d=new Date().toISOString().slice(0,10);if(!TR.test(r.h))r.h='09:00';r.av=num(r.av,30);r.dur=num(r.dur,60)});
  d.yd.forEach(e=>{e.m=num(e.m,1);e.d=num(e.d,1);if(e.av!=null)e.av=num(e.av,7)});
  const keys=(o,re)=>{if(!obj(o))return{};Object.keys(o).forEach(k=>{if(!re.test(k))delete o[k]});return o};
  d.x=keys(d.x,DR);d.o=keys(d.o,DR);d.c=keys(d.c,DR);d.md=keys(d.md,DR);d.f=keys(d.f,MR);d.sl=keys(d.sl,DR);
  Object.keys(d.f).forEach(k=>{d.f[k]=Array.isArray(d.f[k])?d.f[k].filter(obj).map(t=>(t.v=num(t.v,0),t)).filter(t=>typeof t.d=='string'&&DR.test(t.d)):[]});
  Object.keys(d.sl).forEach(k=>{const e=d.sl[k];if(!obj(e)||!TR.test(e.a)||!TR.test(e.b))delete d.sl[k]});
  if(obj(d.cy)){d.cy.st=Array.isArray(d.cy.st)?d.cy.st.filter(x=>DR.test(x)):[];d.cy.len=num(d.cy.len,5)}else delete d.cy;
  if(obj(d.m)&&!TR.test(d.m.t))d.m.t='07:00';
  if(d.tm&&!(obj(d.tm)&&isFinite(d.tm.id)))d.tm=null;
  if(d.slp&&obj(d.slp)&&d.slp.off&&!TR.test(d.slp.off))d.slp.off='';
  ['th','gz','ic','fam'].forEach(k=>{if(d[k]!=null&&!/^[a-z0-9-]{1,24}$/.test(d[k]))delete d[k]});
  if(d.lk!=null)d.lk=num(d.lk,5);
  return d}

/* ---------- cofre: PBKDF2-SHA256 (600 mil rodadas) + AES-GCM 256 ---------- */
const V={key:null,salt:null,it:KIT,busy:false,dirty:false,hid:0,
  async derive(pass,salt,it){const b=await crypto.subtle.importKey('raw',te8.encode(pass.normalize('NFKC')),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:it||KIT},b,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])},
  async enc(o,key,salt,it){key=key||this.key;salt=salt||this.salt;const iv=rnd(12),ad=te8.encode('habit-rc/v1');const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv,additionalData:ad},key,te8.encode(JSON.stringify(o)));return{hrc:1,kdf:'PBKDF2-SHA256',it:it||this.it,salt:b64e(salt),iv:b64e(iv),ct:b64e(ct)}},
  async dec(b,key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(b.iv),additionalData:te8.encode('habit-rc/v1')},key,b64d(b.ct));return JSON.parse(td8.decode(pt))},
  async open(pass,b){const salt=b64d(b.salt),key=await this.derive(pass,salt,b.it);const d=await this.dec(b,key);return{d,key,salt,it:b.it||KIT}},
  persist(o){if(!this.key){lsS('gt3h',JSON.stringify(o));return}this.dirty=true;if(!this.busy)this.flush()},
  async flush(){if(!this.key)return;this.busy=true;try{while(this.dirty){this.dirty=false;const b=await this.enc(S);lsS('gt3e',JSON.stringify(b));lsD('gt3h')}}catch(e){}this.busy=false},
  async idle(){while(this.busy||this.dirty){await this.flush();await new Promise(r=>setTimeout(r,30))}}};
function save(raw){if(!raw)S.upd=Date.now();V.persist(S);lsS('gt3t',S.th||'');if(!raw){if(typeof pxQueue=='function')pxQueue();gdQueue()}}

/* ---------- retorno do login Google (token só na memória) ---------- */
let GT=null,GERR='';
(()=>{if(!/access_token=|error=/.test(location.hash))return;const h=new URLSearchParams(location.hash.slice(1)),st=(lsG('gt3st')||'').split('|');lsD('gt3st');history.replaceState(null,'',location.pathname+location.search);
  if(h.get('error')){GERR=h.get('error');return}
  if(!st[0]||h.get('state')!==st[0]||Date.now()-Number(st[1])>9e5){GERR='state';return}
  if(!(h.get('scope')||'').split(' ').includes(GSC)){GERR='scope';return}
  GT={tk:h.get('access_token'),exp:Date.now()+(Number(h.get('expires_in'))||3600)*1e3-9e4,ok:false}})();

/* ---------- tela de bloqueio ---------- */
function failInfo(){try{return JSON.parse(lsG('gt3f'))||{n:0,u:0}}catch(e){return{n:0,u:0}}}
function lockScreen(){const th=lsG('gt3t');if(th&&/^[a-z0-9-]+$/.test(th))document.documentElement.dataset.theme=th;
  const o=document.createElement('div');o.id='lock';o.className='onb';
  o.innerHTML=`<form class="onc" id="lkf" autocomplete="off" novalidate><img src="icon.png" class="onl" alt=""><h2>RC Life trancado</h2><p class="mu">Seus dados estão criptografados neste aparelho. Digite a senha do cofre.</p><input id="lkp" type="password" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" autocomplete="current-password" placeholder="Senha do cofre" aria-label="Senha do cofre" style="text-align:center;font-size:22px;letter-spacing:.3em" required><button type="button" class="kbt" id="lkk">Minha senha tem letras</button><button class="b" id="lkb" type="submit">Destrancar</button><p class="mu sm" id="lkm" role="status" style="min-height:20px"></p><button type="button" class="b t sm" id="lkx" style="justify-self:center">Esqueci a senha</button></form>`;
  document.body.appendChild(o);const p=o.querySelector('#lkp'),m=o.querySelector('#lkm'),bt=o.querySelector('#lkb');setTimeout(()=>p.focus(),60);
  const wait=()=>{const f=failInfo(),s=Math.ceil((f.u-Date.now())/1e3);if(s>0){bt.disabled=true;m.textContent='Muitas tentativas. Aguarde '+s+' s.';setTimeout(wait,1000);return true}bt.disabled=false;return false};wait();
  o.querySelector('#lkf').onsubmit=async e=>{e.preventDefault();if(wait())return;const pw=p.value;if(!pw)return;bt.disabled=true;m.textContent='Verificando…';
    try{const b=JSON.parse(lsG('gt3e'));const r=await V.open(pw,b);V.key=r.key;V.salt=r.salt;V.it=r.it;lsD('gt3f');p.value='';o.remove();window.__S0=r.d;boot()}
    catch(x){const f=failInfo();f.n++;if(f.n>=3)f.u=Date.now()+Math.min(36e5,15e3*2**(f.n-3));lsS('gt3f',JSON.stringify(f));p.value='';m.textContent='Senha incorreta.';bt.disabled=false;wait();p.focus()}};
  o.querySelector('#lkk').onclick=e=>{const t=p.inputMode=='numeric';p.inputMode=t?'text':'numeric';if(t)p.removeAttribute('pattern');else p.setAttribute('pattern','[0-9]*');e.target.textContent=t?'Usar teclado numérico':'Minha senha tem letras';p.blur();setTimeout(()=>p.focus(),50)};
  o.querySelector('#lkx').onclick=()=>{m.innerHTML='Sem a senha ninguém consegue abrir os dados, nem eu. Opções: lembrar a senha, ou apagar os dados deste aparelho e restaurar pelo Google/backup (que também pedem a senha do cofre). <button type="button" class="b t sm" id="lkw" style="margin-top:8px">Apagar dados deste aparelho</button>';
    o.querySelector('#lkw').onclick=()=>{const c=prompt('Isso apaga TODOS os dados do RC Life deste aparelho. Para confirmar, digite APAGAR');if(c==='APAGAR'){['gt3e','gt3h','gt3f','gt3t'].forEach(lsD);location.reload()}}}}

/* ---------- janelas de senha ---------- */
function passSheet(title,html,fields,okLabel){return new Promise(res=>{const o=sheet(`${shT(title)}<form id="psf" autocomplete="off" novalidate>${html}${fields.map((f,i)=>`<input id="ps${i}" type="password" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" autocomplete="${f[1]}" placeholder="${hx(f[0])}" aria-label="${hx(f[0])}" style="width:100%;margin-top:10px;font-size:20px;letter-spacing:.2em;text-align:center">`).join('')}${fields[0][1]=='current-password'?'<button type="button" class="kbt" id="psk">Minha senha tem letras</button>':''}<p class="mu sm" id="psm" role="status" style="min-height:18px;margin-top:8px"></p><div class="row"><button class="b" type="submit">${okLabel}</button><button class="b t" type="button" id="psc">Cancelar</button></div></form>`);
  const done=v=>{o.remove();res(v)};o.onclick=e=>{if(e.target==o)done(null)};o.querySelector('.sht .ib').onclick=()=>done(null);o.querySelector('#psc').onclick=()=>done(null);setTimeout(()=>{const f=o.querySelector('#ps0');if(f)f.focus()},60);
  o.querySelector('#psf').onsubmit=e=>{e.preventDefault();const v=fields.map((f,i)=>o.querySelector('#ps'+i).value);const msg=t=>o.querySelector('#psm').textContent=t;const r=(o.check||(()=>''))(v);if(r)return msg(r);done(v)};const k=o.querySelector('#psk');if(k)k.onclick=()=>{const p=o.querySelector('#ps0'),t=p.inputMode=='numeric';p.inputMode=t?'text':'numeric';if(t)p.removeAttribute('pattern');else p.setAttribute('pattern','[0-9]*');k.textContent=t?'Usar teclado numérico':'Minha senha tem letras';p.blur();setTimeout(()=>p.focus(),50)};o.check=null;passSheet.cur=o})}
const pwWeak=p=>/^(\d)\1+$/.test(p)||'01234567890123456789'.includes(p)||'98765432109876543210'.includes(p);
const pwRule=v=>!/^\d+$/.test(v[0])?'Use apenas números.':v[0].length<6?'Use pelo menos 6 números (8 ou mais é bem mais seguro).':pwWeak(v[0])?'Evite sequências como 123456 ou 000000.':v[1]!==undefined&&v[0]!==v[1]?'As senhas não são iguais.':'';
function askNew(title,extra){const p=passSheet(title,extra||'',[['Nova senha (só números)','new-password'],['Repita a senha','new-password']],'Salvar');passSheet.cur.check=pwRule;return p}

async function vaultNew(next){const v=await askNew('Criar senha do cofre','<p class="mu sm">Tudo no app passa a ficar criptografado (AES-256) com uma chave que só sai da sua senha. <b>Se você esquecer a senha, ninguém consegue recuperar os dados</b>, então escolha números que você lembre. Use <b>pelo menos 6 números</b>; com 8 ou mais fica muito mais difícil de quebrar. Evite datas de aniversário e sequências.</p>');if(!v)return false;
  toast('Criando o cofre…');V.salt=rnd(16);V.it=KIT;V.key=await V.derive(v[0],V.salt,KIT);V.persist(S);await V.idle();lsD('gt3h');save(1);toast('🔒 Cofre ativado. O app vai pedir a senha ao abrir.',6000);S.upd=Date.now();save(1);gdQueue();if(next)await next();else cfg();return true}
async function vaultCheck(t){const pw=await askPass(t||'Confirme a senha','Digite a senha atual do cofre.');if(!pw)return null;try{return await V.open(pw,JSON.parse(lsG('gt3e')))}catch(e){toast('Senha incorreta.');return null}}
async function vaultChange(){const r=await vaultCheck('Trocar senha');if(!r)return;const v=await askNew('Nova senha');if(!v)return;toast('Trocando a senha…');V.salt=rnd(16);V.key=await V.derive(v[0],V.salt,KIT);save();await V.idle();toast('Senha trocada.'+(S.gd&&S.gd.on?' Os outros aparelhos vão pedir a nova senha na próxima sincronização.':''),6000);cfg()}
async function vaultOff(){const r=await vaultCheck('Desativar cofre');if(!r)return;if(!confirm('Sem o cofre, os dados ficam sem criptografia neste aparelho e na cópia do Google. Continuar?'))return;V.key=null;lsD('gt3e');save(1);toast('Cofre desativado.');gdQueue();cfg()}
const lkSec=()=>V.key?`<div class="set"><span>🔒 Cofre ativo<br><small class="mu">AES-256 · senha nunca é guardada</small></span><button class="b sm t" onclick="lockNow()" style="white-space:nowrap">Trancar agora</button></div><div class="set"><span>Trancar sozinho após</span><select onchange="S.lk=+this.value;save()" style="max-width:130px">${[1,5,15,60].map(m=>`<option value="${m}" ${(S.lk||5)==m?'selected':''}>${m} min</option>`).join('')}</select></div><div class="row"><button class="b sm t" onclick="vaultChange()">Trocar senha</button><button class="b sm t" onclick="vaultOff()">Desativar cofre</button></div>`
  :`<p class="mu sm"><b>Opcional.</b> Crie uma senha e tudo no app (hábitos, finanças, notas, chave da IA) fica criptografado. Sem a senha, nem quem pegar seu celular destravado, nem o Google, nem eu conseguimos ler.</p><div class="row"><button class="b" onclick="vaultNew()">${I('lock')}Criar senha do cofre</button></div>`;

/* ---------- backup criptografado ---------- */
async function bkpFile(){S.bk=Date.now();save(1);const d=Object.assign({},S);delete d.k;const nm='habit-rc-backup-'+ymd(new Date());
  if(V.key)return shareF(new File([JSON.stringify(await V.enc(d))],nm+'.hrc.json',{type:'application/json'}),'Backup criptografado salvo nos seus downloads. Para abrir, use a senha do cofre.');
  shareF(new File([JSON.stringify(d)],nm+'.json',{type:'application/json'}),'Backup salvo nos seus downloads.')}
async function bkpRead(f){let d=JSON.parse(await f.text());if(d&&d.hrc&&d.ct){const pw=await askPass('Backup criptografado','Digite a senha do cofre de quando este backup foi feito.');if(!pw)return 0;try{d=(await V.open(pw,d)).d}catch(e){toast('Senha incorreta para este backup.');return 0}}return clean(d)}

/* ---------- Google Drive (pasta oculta do app) ---------- */
function gAuth(){V.flush();const st=b64e(rnd(24)).replace(/[^a-zA-Z0-9]/g,'');lsS('gt3st',st+'|'+Date.now());
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+new URLSearchParams({client_id:GID,redirect_uri:location.origin+location.pathname.replace(/index\.html$/,''),response_type:'token',scope:GSC,state:st,include_granted_scopes:'false'})}
async function gVerify(){if(!GT||GT.ok)return!!GT;const r=await fetch('https://oauth2.googleapis.com/tokeninfo?access_token='+encodeURIComponent(GT.tk));const j=await r.json().catch(()=>({}));
  if(!r.ok||j.aud!==GID||!String(j.scope||'').split(' ').includes(GSC)){GT=null;throw new Error('token inválido')}GT.ok=true;return true}
async function gApi(path,opt){opt=opt||{};const r=await fetch('https://www.googleapis.com/'+path,Object.assign({},opt,{headers:Object.assign({Authorization:'Bearer '+GT.tk},opt.headers||{})}));if(r.status==401){GT=null;throw new Error('login expirou')}if(!r.ok){const j=await r.json().catch(()=>({})),why=((j.error||{}).errors||[{}])[0].reason||'';if(why=='storageQuotaExceeded')throw new Error('o armazenamento da sua conta Google está cheio. Libere espaço em one.google.com/storage (Gmail, Fotos ou Drive) e toque na nuvem de novo');throw new Error('Google respondeu '+r.status+(why?' ('+why+')':''))}return r}
async function gFind(){const q=encodeURIComponent(`name='${GFN}' and trashed=false`);const j=await(await gApi('drive/v3/files?spaces=appDataFolder&fields=files(id,modifiedTime,appProperties)&q='+q)).json();return(j.files||[]).sort((a,b)=>String(b.modifiedTime).localeCompare(a.modifiedTime))[0]||null}
async function gGet(id){return(await gApi('drive/v3/files/'+encodeURIComponent(id)+'?alt=media')).json()}
async function gPut(blob,upd,id){const meta={name:GFN,mimeType:'application/json',appProperties:{upd:String(upd)}};if(!id)meta.parents=['appDataFolder'];const bd='hrc'+b64e(rnd(12)).replace(/[^a-zA-Z0-9]/g,'');
  const body=`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(blob)}\r\n--${bd}--`;
  const r=await gApi('upload/drive/v3/files'+(id?'/'+encodeURIComponent(id):'')+'?uploadType=multipart&fields=id',{method:id?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+bd},body});return(await r.json()).id}
let gBusy=false,gTm=null;
const gLive=()=>GT&&Date.now()<GT.exp;
function gdQueue(){if(!(S.gd&&S.gd.on&&gLive()))return;clearTimeout(gTm);gTm=setTimeout(()=>gSync(),5000)}
function gKeep(){return{gd:S.gd,px:S.px,ic:S.ic,lk:S.lk,tm:S.tm}}
const gW=d=>{const tx=Object.values(d.f||{}).reduce((n,a)=>n+(a||[]).length,0),x=Object.keys(d.x||{}).length,h=(d.h||[]).length,n=(d.n||[]).length;return{h,n,tx,x,w:h+n+tx+x+(d.bl||[]).length+(d.sh||[]).length+(d.yd||[]).length+(d.v||[]).length}};
const gWTxt=c=>`${c.h} hábitos · ${c.x} dias registrados · ${c.n} notas e tarefas · ${c.tx} lançamentos`;
async function gOpenRemote(f){const b=await gGet(f.id);if(b&&b.plain)return{d:b.d,key:V.key,salt:V.salt,it:V.it};try{return{d:await V.dec(b,V.key),key:V.key,salt:V.salt,it:V.it}}catch(e){}
  const pw=await askPass('Senha da cópia do Google','Digite a senha do cofre usada no aparelho que salvou estes dados no Google.');if(!pw)return null;try{return await V.open(pw,b)}catch(x){toast('Senha incorreta.');return null}}
function gChoose(rd,ru){return new Promise(res=>{const L=gW(S),R=gW(rd);const o=sheet(`${shT('Qual versão manter?')}<p class="mu sm">Os dados deste aparelho e os do Google estão diferentes. Escolha qual manter: a outra versão será substituída.</p><button class="chv" id="gcL"><b>Manter os deste aparelho</b><small>${gWTxt(L)}</small>${L.w>=R.w?'<em>tem mais dados</em>':''}</button><button class="chv" id="gcR"><b>Usar os do Google</b><small>${gWTxt(R)} · salvo em ${new Date(ru).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</small>${R.w>L.w?'<em>tem mais dados</em>':''}</button>`);
  const done=v=>{o.remove();res(v)};o.onclick=e=>{if(e.target==o)done(null)};o.querySelector('.sht .ib').onclick=()=>done(null);o.querySelector('#gcL').onclick=()=>done('L');o.querySelector('#gcR').onclick=()=>done('R')})}
async function gApply(r,f,ru){const d=clean(r.d);if(!d)throw new Error('arquivo do Google inválido');const keep=gKeep();Object.assign(d,keep);d.gd=Object.assign({},keep.gd,{on:1,base:ru,at:Date.now(),id:f.id});d.upd=ru;
  V.key=r.key;V.salt=r.salt;V.it=r.it;S=d;save(1);await V.idle();lsD('gt3h');if(typeof applyTh=='function'){applyTh();applyIcon();tbar();render()}}
async function gPull(f,ru){const r=await gOpenRemote(f);if(!r)return false;await gApply(r,f,ru);return true}
/* junta duas versões sem perder nada: itens pelo id, registros por dia, lançamentos sem repetir; o mais recente vence nos ajustes */
function gMerge(a,b){const cp=o=>JSON.parse(JSON.stringify(o||{})),wa=gW(a).w,wb=gW(b).w,na=Math.abs(wa-wb)>Math.max(wa,wb)*.2?wa>wb:(a.upd||0)>=(b.upd||0),N=cp(na?a:b),O=cp(na?b:a),out=Object.assign(cp(O),cp(N));
  ['h','v','n','bl','sh','yd','cl','rn'].forEach(k=>{const m=new Map();(O[k]||[]).forEach(x=>m.set(String(x.id),x));(N[k]||[]).forEach(x=>m.set(String(x.id),x));out[k]=[...m.values()]});
  ['x','o','c','md','sl'].forEach(k=>{const r={};[O[k]||{},N[k]||{}].forEach(src=>Object.keys(src).forEach(d=>{const v=src[d];r[d]=v&&typeof v=='object'&&!Array.isArray(v)?Object.assign({},r[d],v):v}));out[k]=r});
  const f={};[O.f||{},N.f||{}].forEach(src=>Object.keys(src).forEach(m=>{f[m]=f[m]||[];const seen=new Set(f[m].map(t=>JSON.stringify([t.d,t.x,t.v])));(src[m]||[]).forEach(t=>{const k=JSON.stringify([t.d,t.x,t.v]);if(!seen.has(k)){seen.add(k);f[m].push(t)}})}));out.f=f;
  out.bg=Object.assign({},O.bg,N.bg);if(O.cy||N.cy){out.cy=Object.assign({},O.cy,N.cy);out.cy.st=[...new Set([...((O.cy||{}).st||[]),...((N.cy||{}).st||[])])].sort()}
  return out}
async function gJoin(r,f){const keep=gKeep(),d=clean(gMerge(S,r.d));if(!d)throw new Error('não consegui juntar os dados');Object.assign(d,keep);if(!V.key&&r.key){V.key=r.key;V.salt=r.salt;V.it=r.it}
  d.upd=Date.now();S=d;save(1);await V.idle();lsD('gt3h');await gPush(f);if(typeof applyTh=='function'){applyTh();applyIcon();tbar();render()}}
async function gPush(f){const blob=V.key?await V.enc(S):{hrc:1,plain:1,d:S};const id=await gPut(blob,S.upd||Date.now(),f&&f.id);S.gd=Object.assign({},S.gd,{on:1,base:S.upd,at:Date.now(),id});save(1);return id}
async function gSync(manual){if(gBusy)return;if(!(S.gd&&S.gd.on))return;
  if(!gLive()){if(manual)return gAuth();return}
  gBusy=true;gUI('…');
  try{await gVerify();const f=await gFind(),ru=f?Number((f.appProperties||{}).upd)||0:0,base=S.gd.base||0,lu=S.upd||0;
    if(f&&ru&&ru!==base&&ru!==lu){
      const r=await gOpenRemote(f);if(!r)return;const L=gW(S).w,R=gW(r.d).w;
      if(lu>base||!base){if(L<=3){await gApply(r,f,ru);toast('☁️ Seus dados da conta chegaram neste aparelho.',5000);return}await gJoin(r,f);toast('☁️ Dados juntados: tudo deste aparelho e da sua conta agora está aqui e no Google.',6000);return}
      let pick='R';if(R*2<L&&L>8)pick=await gChoose(r.d,ru);
      if(!pick)return;
      if(pick=='R'){await gApply(r,f,ru);toast('☁️ Dados atualizados com a cópia do Google.',5000);return}
      await gPush(f);toast('☁️ Dados deste aparelho enviados ao Google.');return}
    if(!f||lu!==ru){await gPush(f);if(manual)toast('☁️ Salvo no seu Google Drive.')}else{S.gd.at=Date.now();save(1);if(manual)toast('☁️ Tudo em dia com o Google.')}}
  catch(e){toast('Sincronização: '+(e.message||e),7000)}finally{gBusy=false;gUI();if(S.gd&&S.gd.on&&!document.getElementById('gdb')&&typeof render=='function')render()}}
function gConnect(){lsS('gt3go','1');gAuth()}
async function gAfterBoot(){
  if(GERR){toast(GERR=='access_denied'?'Login do Google cancelado.':'Não consegui confirmar o login do Google ('+GERR+'). Tente de novo.',7000);lsD('gt3go');return}
  if(!GT)return;const pend=lsG('gt3go');lsD('gt3go');
  try{await gVerify()}catch(e){return toast('Login do Google recusado: '+e.message,7000)}
  if(pend){gBusy=true;try{const f=await gFind(),ru=f?Number((f.appProperties||{}).upd)||0:0;
      if(f){const r=await gOpenRemote(f);if(!r){gBusy=false;return}
        if(gW(S).w<=3){await gApply(r,f,ru);gBusy=false;return toast('☁️ Pronto! Todos os dados da sua conta foram transferidos para este aparelho.',7000)}
        S.gd=Object.assign({},S.gd,{on:1,base:ru});await gJoin(r,f);gBusy=false;return toast('☁️ Pronto! Os dados da sua conta foram transferidos e juntados com os deste aparelho.',7000)}
      
      S.gd=Object.assign({},S.gd,{on:1,base:0});save(1);gBusy=false;return gSync(true)}
    catch(e){gBusy=false;return toast('Google: '+(e.message||e),7000)}}
  if(S.gd&&S.gd.on)gSync()}
async function gOff(){if(!confirm('Desconectar o Google? Os dados continuam neste aparelho.'))return;let del=false;
  if(gLive()&&confirm('Apagar também a cópia guardada no seu Google Drive?')){try{const f=await gFind();if(f)await gApi('drive/v3/files/'+encodeURIComponent(f.id),{method:'DELETE'});del=true}catch(e){toast('Não consegui apagar no Google: '+e.message)}}
  if(GT){fetch('https://oauth2.googleapis.com/revoke?token='+encodeURIComponent(GT.tk),{method:'POST'}).catch(()=>{});GT=null}
  S.gd={on:0};save(1);render();toast(del?'Google desconectado e cópia apagada.':'Google desconectado.');cfg()}
function gUI(s){const b=document.getElementById('gdb');if(b)b.classList.toggle('spin',!!s)}
const gdSec=()=>{const on=S.gd&&S.gd.on;return on?`<div class="set"><span>☁️ Google Drive conectado<br><small class="mu">${S.gd.at?'Última sincronização: '+new Date(S.gd.at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'Ainda não sincronizado'}${gLive()?' · automática ligada':''}</small></span></div><div class="row"><button class="b sm" onclick="gSync(1)">Sincronizar agora</button><button class="b sm t" onclick="gOff()">Desconectar</button></div><p class="mu sm" style="margin-top:6px">${V.key?'Os dados vão criptografados para uma pasta oculta do app no seu Drive: o Google guarda, mas não consegue ler.':'Os dados vão para uma pasta oculta do app no seu Drive. Dica: crie uma senha do cofre para que eles vão criptografados.'} Enquanto o app está aberto e conectado, cada mudança é enviada sozinha.</p>`
  :`<p class="mu sm">Guarde tudo na sua conta Google e use o mesmo RC Life no iPhone e no PC. Os dados ficam numa pasta oculta que só este app acessa${V.key?', criptografados com a senha do cofre':''}.</p><div class="row"><button class="b" onclick="gConnect()">${I('cloud')}Conectar Google</button></div>`};

/* ---------- avisos com criptografia de ponta a ponta (o servidor só vê texto embaralhado) ---------- */
function idbK(){return new Promise((res,rej)=>{const r=indexedDB.open('hrc',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function pxKey(){const db=await idbK();const get=()=>new Promise((res,rej)=>{const q=db.transaction('k').objectStore('k').get('n');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});let k=await get();
  if(!k){k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);await new Promise((res,rej)=>{const t=db.transaction('k','readwrite');t.objectStore('k').put(k,'n');t.oncomplete=res;t.onerror=()=>rej(t.error)})}return k}
async function pxSeal(items){const k=await pxKey();return Promise.all(items.map(async i=>{const iv=rnd(12);const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,te8.encode(JSON.stringify({t:i.title,b:i.body}))));const u=new Uint8Array(12+ct.length);u.set(iv);u.set(ct,12);return{ts:i.ts,tag:i.tag,c:b64e(u)}}))}
