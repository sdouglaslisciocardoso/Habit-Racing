<style>

.bars{display:flex;gap:10px}.bar{flex:1;text-align:center}.col{height:110px;display:flex;align-items:flex-end}.col i{width:100%;border-radius:6px 6px 0 0;background:linear-gradient(var(--am),var(--red));min-height:3px;transition:height .6s}.bar span{font-size:13px;color:var(--mu)}

.chat{max-height:48vh;overflow:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}.m{padding:10px 14px;border-radius:14px;max-width:88%}.m.user{align-self:flex-end;background:var(--red)}.m.assistant{background:#ffffff0f;border:1px solid var(--bd)}

.toast{bottom:24px;background:#12141aee;border:1px solid var(--red);padding:12px 18px;border-radius:10px;max-width:90vw;backdrop-filter:blur(10px)}

.cell.sl{border-color:var(--am);color:var(--am)}.md{position:fixed;inset:0;background:#000b;backdrop-filter:blur(4px);display:grid;place-items:center;z-index:70;padding:20px}.md .c{width:min(520px,100%)}
input{color-scheme:dark}
header,.md,.toast,.ov.full{-webkit-backdrop-filter:blur(12px)}
#hero,#st{max-width:980px;margin:14px auto 0;padding:0 20px}#hero:empty{display:none}
#st{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}
.tl{background:linear-gradient(160deg,var(--p2),var(--p));border:1px solid var(--bd);border-radius:12px;padding:10px 14px;display:grid;gap:3px;align-content:start}.tl b{font-size:24px;font-style:italic;line-height:1.1}.tl small{font-size:13px}.tl .pb{height:6px}
.hero{background:linear-gradient(135deg,#2c1219,var(--p))}.hero p{font-size:clamp(20px,5vw,26px);line-height:1.3;font-weight:600;margin:6px 0 14px}.hero details{margin-left:auto}

nav button .ic{margin-right:6px}
@media(max-width:700px){nav{position:fixed;bottom:0;left:0;right:0;z-index:6;max-width:none;margin:0;padding:6px 8px calc(10px + env(safe-area-inset-bottom));gap:6px;background:#0a0b10f2;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--bd);justify-content:space-around}nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:68px;padding:8px 2px;font-size:14px;font-weight:600;line-height:1.1;clip-path:none;border-radius:14px}nav button .ic{font-size:30px;line-height:1;margin:0}main{padding-bottom:150px}.toast{bottom:calc(104px + env(safe-area-inset-bottom))}#st{gap:8px}.tl{padding:8px 10px}.tl b{font-size:20px}}
.clk{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin:-2px 0 4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><div class="lg">GT3<b>/</b>Habit Racing</div><button class="b ghost" onclick="bell()" aria-label="Avisos">🔔</button></header>
<div id="hero"></div><div id="st"></div><nav id="nav"></nav><main id="m"></main>
<script>
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()),hm=d=>p2(d.getHours())+':'+p2(d.getMinutes()),dow=d=>(d.getDay()+6)%7;
const DN=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'],ALL=[0,1,2,3,4,5,6];
const R=[[0,'BRONZE','#cd7f32'],[300,'SILVER','#c0c8d6'],[800,'GOLD','#ffc83d'],[2000,'PLATINUM','#7de8ff']];
const SG=[['Beber água','08:00'],['Alongar','07:15'],['Caminhada','17:30'],['Revisão do dia','22:00'],['Dormir cedo','23:00']];
let S=null;try{S=JSON.parse(localStorage.getItem('gt3h'))}catch(e){}
S=S||{h:[{id:1,n:'Beber água',t:'07:00',d:ALL},{id:2,n:'Treino',t:'18:00',d:[0,2,4]},{id:3,n:'Ler 20 minutos',t:'21:00',d:ALL}],x:{},v:[],k:''};
S.o=S.o||{};S.n=S.n||[];let nq='',dr={};S.m=S.m||{on:1,t:'07:00',last:''};let tab='hoje',chat=[],adj=false;
const save=()=>{try{localStorage.setItem('gt3h',JSON.stringify(S))}catch(e){}};
const on=(h,d)=>{const o=(S.o||{})[ymd(d)];return o&&o[h.id]!==undefined?!!o[h.id]:h.dt?h.dt==ymd(d):h.d.includes(dow(d))};
const sched=d=>S.h.filter(h=>on(h,d)).sort((a,b)=>a.t.localeCompare(b.t));
const isDone=(d,id)=>!!(S.x[ymd(d)]||{})[id];
const stats=d=>{const l=sched(d);return{t:l.length,d:l.filter(h=>isDone(d,h.id)).length}};
const vd=v=>Math.floor((Date.now()-v.s)/864e5),vbest=v=>Math.max(v.b,vd(v));
function streak(){let n=0,d=new Date(),s=stats(d);if(!(s.t&&s.d==s.t))d.setDate(d.getDate()-1);for(let i=0;i<365;i++){s=stats(d);if(s.t){if(s.d==s.t)n++;else break}d.setDate(d.getDate()-1)}return n}
function pts(){let p=0;for(const k in S.x){p+=Object.keys(S.x[k]).length*10;const s=stats(new Date(k+'T12:00'));if(s.t&&s.d==s.t)p+=50}S.v.forEach(v=>p+=v.u*5+vbest(v)*5);return p}
function toast(m,ms=4500){document.querySelectorAll('.toast').forEach(e=>e.remove());const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
function beep(a){try{const c=new(window.AudioContext||window.webkitAudioContext)();a.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+i*.13;o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.26)})}catch(e){}}
function win(f){const o=document.createElement('div');o.className='ov'+(f?' full':'');o.innerHTML=f?'<div class="fl"></div><h1>P1</h1><p><b>Bandeira quadriculada!</b><br>Dia perfeito, +50 pts</p>':'<div class="mini">🏁 Volta completa +10</div>';document.body.appendChild(o);beep(f?[523,659,784,1046]:[880,1175]);setTimeout(()=>o.remove(),f?2800:1500)}
function radio(m,p='Box, box! ',ms=4500){toast('📻 '+p+m,ms);beep([660,880,660]);try{if(Notification.permission=='granted'){const o={body:p+m,icon:'icon.png',tag:'gt3'};if(navigator.serviceWorker&&navigator.serviceWorker.controller)navigator.serviceWorker.ready.then(r=>r.showNotification('GT3 Habit Racing',o));else new Notification('GT3 Habit Racing',o)}}catch(e){}}
const isIOS=()=>/iPhone|iPad|iPod/.test(navigator.userAgent),isSA=()=>navigator.standalone||matchMedia('(display-mode: standalone)').matches;
function perm(){if(isIOS()&&!isSA())return'<p class="sm mu" style="margin:0 0 12px">📲 Para receber avisos no iPhone: toque em <b>Compartilhar</b>, depois em <b>Adicionar à Tela de Início</b>, e abra o app pelo ícone.</p>';if('Notification' in window&&Notification.permission=='default')return'<div class="row" style="align-items:center;margin:0 0 12px"><span class="sm">🔔 Permita os avisos de horário dos seus hábitos.</span><button class="b" onclick="bell()">Ativar avisos</button></div>';return''}
async function bell(){if(isIOS()&&!isSA())return toast('No iPhone: toque em Compartilhar e depois em Adicionar à Tela de Início, abra pelo ícone e toque em 🔔 de novo.',9000);if(!('Notification' in window))return toast('Este navegador não oferece notificações do sistema. Usarei aviso na tela e som.');const r=await Notification.requestPermission();toast(r=='granted'?'🔔 Avisos ativados. Com o app fechado, quem avisa é o Calendário (Semana, Exportar).':'Avisos bloqueados. Usarei aviso na tela e som.',8000);render()}
const fired={};setInterval(()=>{deliver();purge();const n=new Date(),k=ymd(n),m=n.getHours()*60+n.getMinutes();sched(n).forEach(h=>{if(isDone(n,h.id))return;const[a,b]=h.t.split(':'),t=+a*60+ +b;[[t-5,'Largada em 5 minutos: '],[t,'Luz verde! Hora de: ']].forEach(([x,s])=>{const id=k+h.id+x;if(x==m&&!fired[id]){fired[id]=1;radio(s+h.n)}})})},15000);
function tog(id,ds){const k=ds||ymd(new Date()),m=S.x[k]=S.x[k]||{},was=!!m[id];if(was)delete m[id];else m[id]=1;save();if(!was){const s=stats(new Date(k+'T12:00'));win(s.t&&s.d==s.t)}render()}
function tbox(p,h){const one=h&&h.dt,dt=one||ymd(new Date()),d=h&&!one?h.d:ALL;return`<div class="chs"><label class="ch"><input type="radio" name="${p}tp" value="c" ${one?'':'checked'} onchange="tsel('${p}')"><span>🏁 Campeonato completo</span></label><label class="ch"><input type="radio" name="${p}tp" value="v" ${one?'checked':''} onchange="tsel('${p}')"><span>⚡ Volta rápida</span></label></div><p class="mu sm" id="${p}tx"></p><div class="chs" id="${p}dd">${DN.map((n,i)=>`<label class="ch"><input type="checkbox" value="${i}" ${d.includes(i)?'checked':''}><span>${n}</span></label>`).join('')}</div><div class="row" id="${p}dv"><input id="${p}dt" type="date" value="${dt}" style="max-width:190px"></div>`}
function tsel(p){const v=document.querySelector(`input[name="${p}tp"]:checked`).value=='v';$('#'+p+'dd').style.display=v?'none':'flex';$('#'+p+'dv').style.display=v?'flex':'none';$('#'+p+'tx').textContent=v?'Acontece uma vez só, na data escolhida. É apagada sozinha 24 horas depois do horário marcado.':'Repete toda semana nos dias escolhidos.'}
function tread(p){if(document.querySelector(`input[name="${p}tp"]:checked`).value=='v'){const dt=$('#'+p+'dt').value;if(!dt){toast('Escolha a data da volta rápida.');return null}return{dt,d:[dow(new Date(dt+'T12:00'))]}}const d=[...document.querySelectorAll('#'+p+'dd input:checked')].map(i=>+i.value);if(!d.length){toast('Escolha pelo menos um dia da semana.');return null}return{d}}
function addH(){const n=$('#hn').value.trim();if(!n)return toast('Dê um nome ao hábito.');const r=tread('n');if(!r)return;const h={id:Date.now(),n,t:$('#ht').value||'08:00',d:r.d};if(r.dt)h.dt=r.dt;S.h.push(h);save();render();toast(r.dt?'⚡ Volta rápida marcada para '+r.dt.split('-').reverse().slice(0,2).join('/'):'🏁 Hábito adicionado ao campeonato')}
function delH(id){if(confirm('Remover este hábito?')){S.h=S.h.filter(h=>h.id!=id);save();render()}}
function editH(id){const h=S.h.find(x=>x.id==id),o=document.createElement('div');o.className='md';o.innerHTML=`<div class="c"><b>Editar ${h.dt?'volta rápida':'hábito'}</b><div class="row"><input id="en" value="${esc(h.n)}"><input id="et" type="time" value="${h.t}" style="max-width:140px"></div>${tbox('e',h)}<div class="row"><button class="b" id="es">Salvar</button><button class="b ghost" id="ec">Cancelar</button><button class="b ghost" id="er">Remover</button></div></div>`;document.body.appendChild(o);tsel('e');
$('#ec').onclick=()=>o.remove();$('#er').onclick=()=>{o.remove();delH(id)};$('#es').onclick=()=>{const n=$('#en').value.trim();if(!n)return toast('Dê um nome ao hábito.');const r=tread('e');if(!r)return;h.n=n;h.t=$('#et').value||h.t;h.d=r.d;if(r.dt)h.dt=r.dt;else delete h.dt;save();o.remove();render()}}
function addSg(i){S.h.push({id:Date.now(),n:SG[i][0],t:SG[i][1],d:ALL});save();toast('Hábito adicionado: '+SG[i][0]);render()}
function addV(){const n=$('#vn').value.trim();if(!n)return toast('Dê um nome ao controle.');S.v.push({id:Date.now(),n,s:Date.now()-(+$('#vs').value||0)*864e5,b:0,g:+$('#vg').value||30,c:+$('#vc').value||0,u:0});save();render()}
function delV(id){if(confirm('Remover este controle?')){S.v=S.v.filter(v=>v.id!=id);save();render()}}
function urge(id){S.v.find(v=>v.id==id).u++;save();beep([880,1175]);toast('💪 Fissura vencida! +5 pts. Mais uma curva sem erro.');render()}
function rel(id){if(!confirm('Registrar recaída? A contagem volta a zero e seu recorde fica salvo.'))return;const v=S.v.find(x=>x.id==id);v.b=Math.max(v.b,vd(v));v.s=Date.now();save();toast('Saiu da pista, volta pro box. Todo piloto erra uma curva; a próxima volta começa agora.');render()}
const MSG=['Pole position se conquista nas voltas que ninguém vê. Faça a de hoje valer.','Piloto rápido não é o que nunca erra, é o que volta para a pista no mesmo segundo.','Consistência vence velocidade. Uma volta limpa de cada vez.','Largada boa define a corrida. Comece pelo primeiro hábito do dia.','Hoje é dia de bater o seu melhor tempo. Contra você mesmo.','Pneu frio não faz volta rápida. Aqueça com o menor hábito da lista.','Curva difícil pede freio na hora certa. Descanso também é estratégia.','Quem treina no seco corre bem na chuva. Cumpra o hábito mesmo sem vontade.','Cada hábito cumprido é uma volta somada. No fim do dia, a bandeira é sua.','Não olhe a corrida inteira. Olhe a próxima curva.','O volante é seu. Assuma o controle da sua rotina hoje.','O erro de ontem é a telemetria de hoje. Ajuste o setup e acelere.','Disciplina é o motor. A motivação é só o combustível extra.','Quem faz o pit stop na hora certa ganha a corrida. Pare, respire e volte.','O pódio é feito de dias comuns bem executados.','Pequenos ajustes todos os dias valem mais que uma volta heroica de vez em quando.','Sua sequência é o seu recorde. Proteja ela hoje.','Mantenha a linha de corrida: simples, repetível e eficiente.','Não existe volta perdida quando você aprende algo nela.','Luz verde. Primeiro hábito agora, o resto vem em fila.','Corrida de resistência se ganha poupando energia e mantendo o ritmo.','Piloto de GT3 treina a calma sob pressão. Respire fundo e execute.','Hoje você pode ser 1% melhor que ontem. Em um mês, é outro carro.','A bandeira quadriculada é só o fim. O que vale é a corrida bem pilotada.'];
