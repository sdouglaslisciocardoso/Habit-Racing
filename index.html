<!DOCTYPE html>
<html lang="pt-BR" data-theme="livery"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Habit RC</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Habit RC"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="theme-color" content="#07080b"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#0b0b0e;--p:#141418;--p2:#1c1c21;--bd:#2a2a31;--tx:#f3f3f5;--mu:#8e8e99;--acc:#ffd400;--acc2:#ff2d3d;--onacc:#111;--ok:#1fe08a;--bad:#ff2d3d;--am:#ffc400;--red:var(--bad);--gr:var(--ok);--rad:18px;--brad:999px;--ff:Bahnschrift,'DIN Alternate',-apple-system,'SF Pro Display','Segoe UI',system-ui,sans-serif;--fn:var(--ff);
--bgx:radial-gradient(640px 360px at 88% -8%,#ff2d3d26,transparent),repeating-linear-gradient(45deg,#0d0d10 0 3px,#121216 3px 6px);--cut:none;--par:none}
:root[data-theme=pitwall]{--bg:#04070c;--p:#060c16;--p2:#0a1424;--bd:#16263d;--tx:#dbe6f3;--mu:#6a7f99;--acc:#22d3ee;--acc2:#c084fc;--onacc:#04070c;--ok:#34e89e;--bad:#ff4d6d;--am:#facc15;--rad:10px;--brad:6px;--fn:ui-monospace,'SF Mono',Menlo,'DejaVu Sans Mono',monospace;--bgx:linear-gradient(#0a1220 1px,transparent 1px) 0 0/100% 28px}
:root[data-theme=classico]{--bg:#07080b;--p:#12141a;--p2:#1b1e28;--bd:#2a2e3c;--tx:#eef1f6;--mu:#8a92a6;--acc:#ff2d3d;--acc2:#ffb020;--onacc:#fff;--ok:#1fe08a;--bad:#ff2d3d;--am:#ffb020;--rad:0px;--brad:0px;--bgx:radial-gradient(800px 380px at 90% -5%,#ff2d3d26,transparent),repeating-linear-gradient(45deg,#0a0b0f 0 4px,#0e1016 4px 8px);--cut:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%);--par:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
:root[data-theme=noturno]{--bg:#06060f;--p:#0e0f1d;--p2:#15172b;--bd:#262a48;--tx:#eef0ff;--mu:#8a90b8;--acc:#ff7a1a;--acc2:#4f7cff;--onacc:#170900;--ok:#2ee6a8;--bad:#ff4766;--am:#ffb347;--rad:22px;--brad:999px;--bgx:radial-gradient(700px 420px at 0% -10%,#4f7cff33,transparent),radial-gradient(520px 320px at 100% 0%,#ff7a1a26,transparent)}
*{box-sizing:border-box;margin:0}
body{font:16px/1.45 var(--ff);color:var(--tx);min-height:100vh;background:var(--bgx),var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
input,textarea{background:var(--well);border:1px solid var(--bd);border-radius:calc(var(--rad)*.6);padding:11px 12px;min-width:0;flex:1}
input:focus-visible,button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
/* cabeçalho com faixa de pintura */
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:nowrap;padding:calc(10px + env(safe-area-inset-top)) 20px 12px;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:6px;background:linear-gradient(var(--acc),var(--acc)) 0 0/100% 4px no-repeat,linear-gradient(var(--stripe),var(--stripe)) 0 5px/100% 1px no-repeat;opacity:.95}
:root[data-theme=pitwall] header::after{background:var(--bd);height:1px;bottom:0}
:root[data-theme=classico] header::after{background:linear-gradient(90deg,var(--acc),var(--acc2),var(--acc),var(--acc2));height:3px;bottom:0}
:root[data-theme=noturno] header::after{background:linear-gradient(90deg,transparent,var(--acc2),var(--acc),transparent);height:2px;bottom:0}
.hbt{display:flex;gap:8px;flex:none}.hbt .b{width:44px;height:44px;padding:0;display:grid;place-items:center;font-size:18px}
.lg{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:900;font-style:italic;font-size:22px;letter-spacing:.03em}.lg b{color:var(--acc2);margin:0 3px}
:root[data-theme=pitwall] .lg{font-family:var(--fn);font-style:normal;letter-spacing:.08em;font-size:18px}:root[data-theme=pitwall] .lg b{color:var(--acc)}
.chip{padding:3px 12px;background:var(--c);color:#111;font-weight:800;font-size:13px;letter-spacing:.08em;border-radius:var(--brad);clip-path:var(--par)}
/* abas */
nav{display:flex;gap:8px;padding:18px 20px 0;max-width:980px;margin:auto;overflow-x:auto}
nav button{background:color-mix(in srgb,var(--tx) 5%,transparent);border:0;padding:11px 20px;cursor:pointer;white-space:nowrap;font-weight:700;border-radius:var(--brad);clip-path:var(--par);transition:.2s;color:var(--mu)}
nav button.on{background:var(--acc);color:var(--onacc)}
:root[data-theme=classico] nav button{color:var(--tx)}:root[data-theme=classico] nav button.on{background:linear-gradient(90deg,var(--acc),#ff6a1f);color:#fff}
:root[data-theme=pitwall] nav button{font-family:var(--fn);text-transform:uppercase;font-size:13px;letter-spacing:.06em}
main{max-width:980px;margin:auto;padding:16px 20px 70px;display:grid;gap:14px}
/* cartões */
.c{position:relative;background:linear-gradient(160deg,var(--p2),var(--p));border:1px solid var(--bd);padding:20px;border-radius:var(--rad);clip-path:var(--cut)}
.c::before{content:"";position:absolute;left:20px;top:0;width:44px;height:4px;border-radius:0 0 4px 4px;background:var(--acc)}
:root[data-theme=classico] .c{padding-left:24px}:root[data-theme=classico] .c::before{left:0;top:0;bottom:0;width:5px;height:auto;border-radius:0;background:linear-gradient(var(--acc),var(--acc2))}
:root[data-theme=pitwall] .c::before,:root[data-theme=noturno] .c::before{display:none}
:root[data-theme=noturno] .c{background:linear-gradient(160deg,color-mix(in srgb,var(--tx) 5%,transparent),color-mix(in srgb,var(--tx) 2%,transparent));-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
summary{cursor:pointer;font-weight:700;font-size:18px}details[open] summary{margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.b{background:var(--acc);color:var(--onacc);border:0;padding:12px 22px;font-weight:800;cursor:pointer;border-radius:var(--brad);clip-path:var(--par);transition:filter .2s,transform .2s}
.b:hover{filter:brightness(1.1);transform:translateY(-1px)}.b.gr{background:var(--ok);color:#04170d}.b.ghost{background:color-mix(in srgb,var(--tx) 7%,transparent);color:var(--tx)}
:root[data-theme=classico] .b{background:linear-gradient(90deg,var(--acc),#ff6a1f);color:#fff}:root[data-theme=classico] .b.ghost{background:color-mix(in srgb,var(--tx) 7%,transparent)}:root[data-theme=classico] .b.gr{background:linear-gradient(90deg,#14b36b,var(--ok));color:#04170d}
:root[data-theme=noturno] .b:not(.ghost){box-shadow:0 6px 24px color-mix(in srgb,var(--acc) 45%,transparent)}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:17px;padding:6px}.x:hover{color:var(--acc)}
.mu{color:var(--mu)}.sm{font-size:14px}
/* painel de instrumentos */
.dash{padding-top:16px;text-align:center}
.leds{display:flex;gap:6px;justify-content:center;margin-bottom:6px}.leds i{width:min(26px,7vw);height:10px;border-radius:5px;background:color-mix(in srgb,var(--tx) 8%,transparent)}
.leds i.g{background:var(--ok);box-shadow:0 0 10px var(--ok)}.leds i.y{background:var(--am);box-shadow:0 0 10px var(--am)}.leds i.r{background:var(--bad);box-shadow:0 0 10px var(--bad)}
.tach{position:relative;width:min(300px,78vw);margin:0 auto}.tach svg{width:100%;display:block}
.tk{stroke:color-mix(in srgb,var(--tx) 8%,transparent)}.tc{position:absolute;left:0;right:0;top:30%;text-align:center}.tc b{display:block;font-weight:900;font-style:italic;font-size:clamp(60px,18vw,78px);line-height:1;font-family:var(--fn)}.tc small{color:var(--mu);font-size:12px;letter-spacing:.2em}
.side{display:flex;justify-content:space-between;margin-top:-26px;padding:0 4px}.side div{min-width:80px}.side b{display:block;font-weight:900;font-style:italic;font-size:26px;font-family:var(--fn)}.side small{font-size:11px;letter-spacing:.18em;color:var(--mu)}
:root[data-theme=pitwall] .tc b,:root[data-theme=pitwall] .side b{font-style:normal;color:var(--acc)}
/* hábitos */
.h{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px;background:color-mix(in srgb,var(--tx) 3%,transparent);border:1px solid var(--bd);border-radius:calc(var(--rad)*.9);margin-bottom:10px;transition:opacity .3s}.h:last-child{margin:0}
.h.d{opacity:.55}.h.d b{text-decoration:line-through}.hi{flex:1;min-width:0}.hi small{display:block;color:var(--mu)}
.hr{font-weight:900;font-style:italic;color:var(--acc2);font-family:var(--fn)}:root[data-theme=pitwall] .hr{font-style:normal;color:var(--acc)}
.hi b{display:block;overflow-wrap:anywhere}
.tm{font-weight:900;font-style:italic;font-size:20px;font-variant-numeric:tabular-nums;color:var(--acc2);font-family:var(--fn)}
:root[data-theme=pitwall] .tm{font-style:normal;color:var(--tx);font-size:16px}
.ck{width:50px;height:50px;border-radius:calc(var(--rad)*.75);border:2px solid var(--bd);background:var(--well);cursor:pointer;font-size:22px;flex:none;transition:.25s;color:var(--onacc)}.ck:hover{border-color:var(--acc);transform:scale(1.06)}.ck.on{background:var(--acc);border-color:var(--acc)}
:root[data-theme=classico] .ck{border-radius:50%}:root[data-theme=classico] .ck.on{background:var(--ok);border-color:var(--ok)}
.ck.qt{font-size:14px;font-weight:900;color:var(--acc);border-color:var(--acc);font-family:var(--fn)}
.ck.sm{width:30px;height:30px;font-size:15px;border-radius:8px}
.tb{padding:6px 14px;font-size:14px;margin-top:6px}
/* topo */
#hero,#st{max-width:980px;margin:16px auto 0;padding:0 20px}#hero:empty{display:none}
#st{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:10px}
.tl{background:linear-gradient(160deg,var(--p2),var(--p));border:1px solid var(--bd);border-top:4px solid var(--acc);border-radius:calc(var(--rad)*.8);padding:10px 14px;display:grid;gap:3px;align-content:start}.tl b{font-size:24px;font-weight:900;font-style:italic;line-height:1.1;font-family:var(--fn)}.tl small{font-size:13px}.tl .pb{height:6px}
:root[data-theme=pitwall] .tl{border-top-width:1px}:root[data-theme=pitwall] .tl b{font-style:normal}
.hero{overflow:hidden;padding-right:26%}
.hero::after{content:"";position:absolute;top:-20%;right:-12%;width:34%;height:150%;transform:skewX(-18deg);background:linear-gradient(90deg,var(--acc) 0 74%,transparent 74% 80%,var(--stripe) 80% 86%,transparent 86%);opacity:.95;pointer-events:none}
.hero p{font-size:clamp(21px,5.4vw,28px);line-height:1.22;font-weight:900;font-style:italic;margin:6px 0 14px;position:relative}
.hero small,.hero .row,.hero details{position:relative;z-index:1}
:root[data-theme=classico] .hero{padding-right:20px;background:linear-gradient(135deg,#2c1219,var(--p))}:root[data-theme=classico] .hero::after{display:none}:root[data-theme=classico] .hero p{font-weight:600;font-style:normal}
:root[data-theme=pitwall] .hero{padding-right:20px;border-color:#1d3655;background:#081322}:root[data-theme=pitwall] .hero::after{display:none}:root[data-theme=pitwall] .hero p{font-style:normal;font-weight:500;font-size:clamp(18px,4.6vw,22px)}:root[data-theme=pitwall] .hero>small{color:var(--acc);font-family:var(--fn);letter-spacing:.14em;text-transform:uppercase}
:root[data-theme=noturno] .hero{padding-right:20px;background:linear-gradient(135deg,#ff7a1a26,#4f7cff1f)}:root[data-theme=noturno] .hero::after{display:none}
/* semana, gráficos, vícios */
.sc{overflow-x:auto}.wk{width:100%;border-collapse:collapse;min-width:540px}.wk th,.wk td{padding:8px;text-align:center}.wk th small,.hn small{display:block;color:var(--mu);font-weight:400}.wk th.td{color:var(--acc)}.hn{text-align:left!important}
.cell{width:42px;height:42px;border-radius:calc(var(--rad)*.5);border:1px solid var(--bd);background:var(--well);cursor:pointer;font-size:18px}.cell.on{background:var(--ok)}.cell:disabled{opacity:.3;cursor:default}.cell.sl{border-color:var(--acc);color:var(--acc)}.no{color:var(--bd);font-style:normal}
.bars{display:flex;gap:10px}.bar{flex:1;text-align:center}.col{height:110px;display:flex;align-items:flex-end}.col i{width:100%;border-radius:6px 6px 0 0;background:linear-gradient(var(--acc),var(--acc2));min-height:3px;transition:height .6s}.bar span{font-size:13px;color:var(--mu)}
.vg{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}.vc{display:grid;gap:6px}.vt{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:700}
.big{font-size:68px;font-weight:900;font-style:italic;line-height:1.05;color:var(--ok);font-variant-numeric:tabular-nums;font-family:var(--fn)}.big small{font-size:20px;margin-left:10px;font-style:normal;color:var(--mu);font-family:var(--ff)}
.clk{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;margin:-2px 0 4px;font-family:var(--fn)}
.pb{height:10px;border-radius:9px;background:var(--well);overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--acc));transition:width .6s}
.chs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.ch input{display:none}
.ch span,.ch2{display:inline-block;padding:7px 14px;border-radius:999px;border:1px solid var(--bd);cursor:pointer;background:var(--well)}.ch input:checked+span{background:var(--acc);border-color:var(--acc);color:var(--onacc)}.ch2{margin:6px 6px 0 0}.ch2:hover{border-color:var(--acc)}.ch2.on{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.chat{max-height:48vh;overflow:auto;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}.m{padding:10px 14px;border-radius:14px;max-width:88%}.m.user{align-self:flex-end;background:var(--acc);color:var(--onacc)}.m.assistant{background:color-mix(in srgb,var(--tx) 6%,transparent);border:1px solid var(--bd)}
/* comemorações e avisos */
.ov{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:50}
.ov.full{background:radial-gradient(circle,#000a,#000f);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);text-align:center;align-content:center;gap:6px;animation:in .3s}
.ov h1{font-size:clamp(90px,22vw,190px);font-style:italic;font-weight:900;line-height:1;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.fl{width:min(70vw,420px);height:200px;background:conic-gradient(#fff 25%,#000 0 50%,#fff 0 75%,#000 0) 0 0/50px 50px;animation:wave 1s infinite ease-in-out;border-radius:6px}
.mini,.toast{position:fixed;left:50%;transform:translateX(-50%);z-index:60;animation:drop .4s cubic-bezier(.2,1.4,.4,1)}
.mini{top:86px;background:var(--acc);color:var(--onacc);padding:12px 26px;font-weight:800;border-radius:var(--brad);clip-path:var(--par)}
.toast{bottom:100px;background:color-mix(in srgb,var(--p) 94%,transparent);border:1px solid var(--acc);padding:12px 18px;border-radius:12px;max-width:90vw;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
@keyframes in{from{opacity:0}}@keyframes drop{from{opacity:0;transform:translate(-50%,-24px)}}@keyframes wave{50%{transform:rotate(3deg) skewY(-3deg)}0%,100%{transform:rotate(-3deg) skewY(3deg)}}
.md{position:fixed;inset:0;background:#000b;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:70;padding:20px;overflow:auto}.md .c{width:min(520px,100%)}
.nt{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--bd)}.nt .hi span{overflow-wrap:anywhere}.nt.d .hi span{text-decoration:line-through;opacity:.55}.ni{font-size:20px;line-height:1.3}
nav button .ic{margin-right:6px}
#tmr{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:8;align-items:center;gap:10px;background:color-mix(in srgb,var(--p) 95%,transparent);border:1px solid var(--acc);padding:10px 14px;border-radius:18px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 10px 40px #000a;width:min(560px,calc(100% - 24px))}
.tmi{flex:1;min-width:0}.tmi small{display:block;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tmi b{font-size:34px;font-style:italic;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1;font-family:var(--fn)}
body.tr main{padding-bottom:250px}
.fg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pos{color:var(--ok)}.neg{color:var(--bad)}
.cr{margin-top:12px}.cn{display:flex;justify-content:space-between;gap:10px}.cn small{color:var(--mu);font-weight:400}.lr{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--bd)}.lr span{overflow-wrap:anywhere}.lr small{display:block;color:var(--mu)}
.mood{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}.mood span{margin-right:4px}.mood button{font-size:24px;background:var(--well);border:1px solid var(--bd);border-radius:12px;padding:4px 8px;cursor:pointer;opacity:.55;transition:.2s}.mood button.on{opacity:1;border-color:var(--acc);background:color-mix(in srgb,var(--acc) 15%,transparent);transform:scale(1.1)}
.hm{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin:12px 0 8px;max-width:520px}.hm i{aspect-ratio:1;border-radius:3px}
/* seletor de tema */
.thg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 18px}
.thb{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;border:2px solid var(--bd);background:var(--well);cursor:pointer;font-weight:700;text-align:left}.thb.on{border-color:var(--acc)}
.sw{width:38px;height:38px;border-radius:10px;flex:none;border:1px solid color-mix(in srgb,var(--tx) 13%,transparent)}
/* celular: barra flutuante */
@media(max-width:700px){
.lg{font-size:19px}.h{gap:10px}.h .x{padding:4px;font-size:16px}
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:10px;right:10px;z-index:6;max-width:none;margin:0;padding:6px;gap:4px;background:color-mix(in srgb,var(--p2) 94%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:26px;justify-content:space-around;box-shadow:0 12px 34px #000b;overflow:visible}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:64px;padding:6px 0;font-size:12px;font-weight:700;line-height:1.1;clip-path:none;border-radius:20px;background:none}
nav button .ic{font-size:27px;line-height:1;margin:0}
nav button.on{background:var(--acc);color:var(--onacc)}
:root[data-theme=classico] nav{border-radius:0;left:0;right:0;bottom:0;padding-bottom:calc(8px + env(safe-area-inset-bottom))}:root[data-theme=classico] nav button.on{border-radius:14px}
:root[data-theme=pitwall] nav{border-radius:12px}:root[data-theme=pitwall] nav button{font-size:10.5px;border-radius:8px}
main{padding-bottom:160px}.toast{bottom:calc(178px + env(safe-area-inset-bottom))}#tmr{bottom:calc(96px + env(safe-area-inset-bottom))}
.fg{grid-template-columns:1fr}#st{gap:8px}.tl{padding:8px 10px}.tl b{font-size:20px}.hero{padding-right:20px}.hero::after{width:22%;right:-14%;opacity:.9}}
/* ===== botões e organização (clean) ===== */
:root{--brad:14px}:root[data-theme=pitwall]{--brad:8px}:root[data-theme=classico]{--brad:6px}:root[data-theme=noturno]{--brad:14px}
.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:var(--brad);font-weight:700;font-size:15px;letter-spacing:.01em;clip-path:none!important;box-shadow:none}
.b .i{width:18px;height:18px}.b:hover{transform:none;filter:brightness(1.08)}.b:active{transform:scale(.97)}
.b.sm{height:36px;padding:0 14px;font-size:14px}.b.wide{width:100%;margin-top:14px;height:auto;min-height:46px;padding:10px 18px;line-height:1.25}

function pDate(s){const td=ymd(new Date()),t=new Date();let m;
if(m=s.match(/\bdepois de amanh[ãa]/i))return[addD(td,2),m[0]];if(m=s.match(/\bamanh[ãa]/i))return[addD(td,1),m[0]];if(m=s.match(/\bhoje\b/i))return[td,m[0]];
if(m=s.match(/(?:\b(?:na|no|nesta|neste|pr[óo]xim[ao])\s+)?\b(domingo|segunda|ter[çc]a|quarta|quinta|sexta|s[áa]bado)(?:-feira)?\b/i)){const w=WD[m[1].toLowerCase()];return[addD(td,(w-dow(t)+7)%7),m[0]]}
if(m=s.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/)){const y=m[3]?(m[3].length==2?'20'+m[3]:m[3]):t.getFullYear();let k=y+'-'+p2(m[2])+'-'+p2(m[1]);if(!m[3]&&k<td)k=(+y+1)+k.slice(4);return[k,m[0]]}
if(m=s.match(/\bdia\s+(\d{1,2})(?:\s+de\s+([a-zç]+))?/i)){const mo=m[2]&&MN[m[2].toLowerCase()]?MN[m[2].toLowerCase()]:t.getMonth()+1;let k=t.getFullYear()+'-'+p2(mo)+'-'+p2(m[1]);if(k<td)k=m[2]?(t.getFullYear()+1)+k.slice(4):ymd(new Date(t.getFullYear(),mo,+m[1]));return[k,m[0]]}
return[null,'']}
function parseDump(txt){const out=[],cap=s=>{s=String(s).trim().replace(/\s+/g,' ').replace(/^[\-–:]\s*/,'');return s?s[0].toUpperCase()+s.slice(1):s},VAL=/(?:R\$\s*)?(\d+(?:[.,]\d{1,2})?)\s*(?:reais|real|conto|pila)?/i;let shop=false;
txt.split(/\n|;|,(?!\d)/).map(x=>x.trim()).filter(Boolean).forEach(p=>{const l=p.toLowerCase();let m;
const money=(verb,tipo)=>{const v=num((p.match(VAL)||[])[1]);const[dt,dm]=pDate(p);let x=p.replace(verb,'').replace(dm,'').replace(VAL,'').replace(/^\s*(no|na|nos|nas|em|de|do|da|com|pro|pra|para o|para a|para)\s+/i,'').trim();out.push(['lancar_gasto',{descricao:cap(x)||(tipo=='saida'?'Gasto':'Entrada'),valor:v,tipo,data:dt||undefined}])};
if(/^(gastei|paguei|comprei|torrei)\b/.test(l)&&VAL.test(p)&&/\d/.test(p)){money(/^(gastei|paguei|comprei|torrei)\s*/i,'saida');shop=false;return}
if(/^(recebi|ganhei|entrou|entraram)\b/.test(l)&&/\d/.test(p)){money(/^(recebi|ganhei|entrou|entraram)\s*/i,'entrada');shop=false;return}
if(m=p.match(/^(?:comprar|compras?:|mercado:|lista:|lista de compras:)\s*(.+)/i)){out.push(['adicionar_compras',{itens:m[1].split(/\s+e\s+/).map(x=>({nome:cap(x)}))}]);shop=true;return}
if(shop&&p.split(/\s+/).length<=3&&!/^[a-zà-ú]+(ar|er|ir)\b/i.test(l)){out[out.length-1][1].itens.push(...p.split(/\s+e\s+/).map(x=>({nome:cap(x)})));return}
shop=false;
if(m=p.match(/anivers[áa]rio\s+(?:d[aeo]s?\s+)?(.+?)\s+(?:[ée]\s+)?(?:dia\s+)?(\d{1,2})(?:\s*\/\s*(\d{1,2})|\s+de\s+([a-zç]+))/i)){const mo=m[3]?+m[3]:MN[(m[4]||'').toLowerCase()];if(mo){out.push(['criar_data_anual',{nome:'Aniversário de '+cap(m[1]),dia:+m[2],mes:mo,tipo:'aniversario',aviso_dias:7}]);return}}
if(m=p.match(/^(conta|boleto|assinatura)\s+(?:de\s+|da\s+|do\s+)?(.+?)\s+(?:todo\s+)?dia\s+(\d{1,2})(?:\D+(\d+(?:[.,]\d{1,2})?))?/i)){out.push(['criar_conta',{nome:cap(m[2]),dia:+m[3],valor:m[4]?num(m[4]):0,tipo:m[1].toLowerCase()=='assinatura'?'assinatura':'conta'}]);return}
if(m=p.match(/^(ideia|nota)\b\s*[:\-–]?\s*(?:de\s+|sobre\s+)?(.+)/i)){out.push(['criar_anotacao',{tipo:m[1].toLowerCase(),texto:cap(m[2])}]);return}
const[dt,dm]=pDate(p),x=cap(p.replace(dm,'').replace(/\s+(até|para|pra|na|no)\s*$/i,''));
if(dt||/^[a-zà-ú]+(ar|er|ir|ôr|or)\b/i.test(l))out.push(['criar_anotacao',{tipo:'tarefa',texto:x,prazo:dt||ymd(new Date())}]);else out.push(['criar_anotacao',{tipo:'nota',texto:x}])});return out}

const row=h=>{const d=isDone(n,h.id),c=(S.c[k]||{})[h.id]||0;return`<div class="h ${d?'d':''}">${h.q&&!d?`<button class="ck qt" onclick="inc(${h.id})" aria-label="Mais uma">${c}/${h.q}</button>`:h.tm&&!d?(S.tm&&S.tm.id==h.id?`<button class="ck run ${S.tm.p?'ps':''}" onclick="pauseT()" aria-label="${S.tm.p?'Retomar':'Pausar'} timer"><span data-tl>${tfmt()}</span></button>`:`<button class="ck play" onclick="startT(${h.id})" aria-label="Iniciar timer de ${h.tm} minutos">${I('play')}</button>`):`<button class="ck ${d?'on':''}" onclick="tog(${h.id})" aria-label="${d?'Desmarcar':'Concluir'}">${d?I('check'):''}</button>`}<div class="hi"><b>${esc(h.n)}</b><small><span class="hr">${h.t}</span> · ${h.dt?'Volta rápida · some em '+left(h):h.d.length==7?'Todos os dias':h.d.map(i=>DN[i]).join(', ')}${h.tm?' · '+h.tm+' min':''}${(S.x[k]||{})[h.id]==2?' · versão mínima':''}</small>${h.mn&&!d&&(h.t<hm(n)||n.getHours()>=19)?`<button class="pill mn" onclick="minH(${h.id})">🛟 Dia difícil? ${esc(h.mn)}</button>`:''}</div><button class="ib g" onclick="editH(${h.id})" aria-label="Opções">${I('more')}</button></div>`};
const fut=S.h.filter(h=>h.dt&&h.dt>k).sort((a,b)=>(a.dt+a.t).localeCompare(b.dt+b.t)),tn=S.n.filter(m=>m.k!='t'&&ymd(new Date(m.ts))==k);
return`<div class="c dash">${gauge(pc,pos,lp)}
<div class="ds"><div><b>${s.d}/${s.t}</b><small>Voltas</small></div><div><b>${streak()}</b><small>Sequência</small></div><div><b>${nx?nx.t:'—'}</b><small>Próxima</small></div></div>
<div class="lv"><span class="chip" style="--c:${r[2]}">${r[1]}</span><div class="pb"><i style="width:${lp}%"></i></div><small class="mu">${p} pts</small></div></div>
${dumpBox()}
<div class="sh"><b>Voltas de hoje</b><small class="mu">${n.toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'})}</small></div>
<div class="c lst">${l.map(row).join('')||`<div class="emp"><b>Pista livre</b><span class="mu sm">Toque em + para adicionar um hábito ou comece com uma rotina pronta.</span><div><button class="b sm" onclick="rots()" style="margin-top:8px">${I('flag')}Ver rotinas de campeões</button></div></div>`}</div>
${vTasks()}
<button class="rbn" onclick="rots()"><span>${I('flag')}</span><div><b>Rotinas de campeões</b><small class="mu">14 rotinas por período ou por perfil</small></div>${I('play')}</button>
${fut.length?`<div class="sh"><b>Próximas voltas rápidas</b></div><div class="c lst">${fut.map(h=>`<div class="h"><div class="hi"><b>${esc(h.n)}</b><small><span class="hr">${h.t}</span> · ${h.dt.split('-').reverse().slice(0,2).join('/')}</small></div><button class="ib g" onclick="editH(${h.id})" aria-label="Opções">${I('more')}</button></div>`).join('')}</div>`:''}
<div class="sh"><b>Diário de bordo</b></div><div class="c"><div class="mood"><span class="mu sm">Motor hoje</span>${MD.map((e,i)=>`<button class="${S.md[k]==i+1?'on':''}" onclick="setMd(${i+1})" aria-label="${ML[i]}" title="${ML[i]}">${e}</button>`).join('')}</div>${slIn()}${cyLine()}${tn.map(noteH).join('')}</div>`}
function cfg(){const ns=isIOS()&&!isSA()?'<span class="mu sm">Instale pela Tela de Início</span>':!('Notification' in window)?'<span class="mu sm">Indisponível</span>':Notification.permission=='granted'?'<span class="okt">Ativados</span>':`<button class="b sm" onclick="bell()">Ativar</button>`;
const o=sheet(`${shT('Ajustes')}<h4>Perfil</h4><div class="sgc">${[['m','Homem'],['f','Mulher']].map(([k,l])=>`<button class="${(S.fam||'m')==k?'on':''}" onclick="setFam('${k}')">${l}</button>`).join('')}</div><label class="set tg"><input type="checkbox" ${cyOn()?'checked':''} onchange="S.cy.on=this.checked;save();render()"><i></i>Acompanhar ciclo menstrual</label><h4>Tema</h4><div class="thg">${TH.filter(t=>t[5]==(S.fam||'m')).map(t=>`<button class="thb ${(S.th||'livery')==t[0]?'on':''}" data-t="${t[0]}" onclick="setTh('${t[0]}')"><span class="sw" style="background:linear-gradient(135deg,${t[2]} 0 46%,${t[3]} 46% 74%,${t[4]} 74%)"></span>${t[1]}</button>`).join('')}</div>
${gzSec()}${icSec()}<h4>Avisos</h4><div class="set"><span>Avisos de horário</span>${ns}</div>${pxSec()}<div class="set"><label class="tg"><input type="checkbox" id="mo" ${S.m.on?'checked':''} onchange="setM()"><i></i>Mensagem do dia</label><input id="mt" type="time" value="${S.m.t}" onchange="setM()" style="max-width:120px;flex:none"></div>
<h4>Engenheiro IA</h4><p class="mu sm">Opcional. Com uma chave da API Anthropic, o engenheiro conversa livremente. A chave fica só neste aparelho.</p><div class="row"><input id="ki" type="password" placeholder="sk-ant-..." value="${esc(S.k||'')}"><button class="b" onclick="setK()">Salvar</button></div>
<h4>Backup</h4><p class="mu sm">Seus dados ficam só neste aparelho. O backup protege contra perda e serve para passar tudo entre PC e iPhone. A chave da API não vai junto.${S.bk?' Último: '+new Date(S.bk).toLocaleDateString('pt-BR')+'.':''}</p><div class="row"><button class="b" id="bx">${I('save')}Fazer backup</button><label class="b t" style="position:relative">Restaurar<input type="file" accept=".json,application/json" id="bi" style="position:absolute;inset:0;opacity:0;width:100%;cursor:pointer"></label></div>`);
$('#bx').onclick=()=>{S.bk=Date.now();save();const d=Object.assign({},S);delete d.k;shareF(new File([JSON.stringify(d)],'habit-rc-backup-'+ymd(new Date())+'.json',{type:'application/json'}),'Backup salvo nos seus downloads.');closeMd();render()};
$('#bi').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d||!Array.isArray(d.h))throw 0;if(!confirm('Substituir todos os dados deste aparelho pelos do backup?'))return;d.k=S.k;S=d;save();location.reload()}catch(x){toast('Este arquivo não é um backup válido do Habit RC.')}}}
function vIa(){return`<div class="sh"><b>Engenheiro de pista</b><small class="mu">${S.k?'Claude conectado':'Modo offline'}</small></div><div class="c"><div id="ch" class="chat"></div><div class="qk">${(S.k?['Organize meu dia de hoje','Crie uma rotina matinal','Reorganize minha semana','Como estou nos vícios?','Resumo dos gastos']:['Organizar meu dia','Analisar minha semana','Sugerir hábitos','Como estou nos vícios?','Resumo dos gastos']).map(q=>`<button class="ch2" onclick="ask('${q}')">${q}</button>`).join('')}</div><div class="cmp"><input id="qi" placeholder="Pergunte ao engenheiro" onkeydown="if(event.key=='Enter')ask()"><button class="ib on" onclick="ask()" aria-label="Enviar">${I('play')}</button></div></div>${S.k?'<p class="mu sm" style="padding:0 4px">O engenheiro pode criar, editar, marcar e reorganizar tudo no app. Peça em linguagem normal, e use ↩ Desfazer se não gostar.</p>':'<div class="bn">'+I('spark')+'<span>Para a IA organizar tudo por você, adicione sua chave da API do Claude em Ajustes.</span><button class="b sm" onclick="cfg()">Ajustes</button></div>'}`}
function tbar(){const e=$('#tmr'),t=S.tm,h=t&&S.h.find(x=>x.id==t.id);document.body.classList.toggle('tr',!!h);if(!h){if(t){S.tm=null;save()}e.style.display='none';e.innerHTML='';return}e.style.display='flex';e.innerHTML=`<div class="tmi"><small>${esc(h.n)}</small><b id="tmt">${tfmt()}</b></div><button class="ib on" onclick="pauseT()" aria-label="${t.p?'Retomar':'Pausar'}">${I(t.p?'play':'pause')}</button><button class="ib" onclick="stopT()" aria-label="Parar">${I('x')}</button>`}
const TB=[['hoje','flag','Hoje'],['sem','cal','Semana'],['not','note','Diário'],['sau','heart','Saúde'],['fin','trend','Finanças']];
function render(){$('#hbt').innerHTML=`<button class="ib${tab=='ia'?' on':''}" onclick="tab=tab=='ia'?'hoje':'ia';render()" aria-label="Engenheiro IA">${I('spark')}</button><button class="ib" onclick="cfg()" aria-label="Ajustes">${I('gear')}</button>`;$('#hero').innerHTML=tab=='hoje'?hero():'';$('#nav').innerHTML=TB.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="tab='${t[0]}';render();scrollTo(0,0)"><span class="ic">${I(t[1])}</span><span>${t[2]}</span></button>`).join('');if(tab=='vic'){tab='sau';hs='vic'}$('#m').innerHTML={hoje:vHoje,not:vNotas,sem:()=>vDatas()+vSem()+vHist(),sau:vSaude,fin:vFin,ia:vIa}[tab]();$('#fab').style.display=tab=='hoje'||tab=='sem'?'grid':'none';if(tab=='ia')draw()}
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
setInterval(tick,1000);purge();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){pxQueue();tick();deliver();purge()}});
(()=>{const q=new URLSearchParams(location.search).get('icone');if(q&&ICS.some(x=>x[0]==q)){S.ic=q;save()}})();applyIcon();
applyTh();rollTasks();tbar();render();deliver();checkAlerts();if(!S.fam)onb();pxQueue();
</script></body></html>
