<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; connect-src https://habit-rc-avisos.sdouglaslisciocardoso.workers.dev; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0e0e13"><title>Box RC Life</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0e0e13;--card:#17171e;--ln:#2a2a33;--tx:#f3f3f1;--mu:#9a9aa6;--acc:#e10600;--ok:#2fd27a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background-image:repeating-linear-gradient(45deg,#ffffff05 0 2px,transparent 2px 6px),repeating-linear-gradient(-45deg,#00000040 0 2px,transparent 2px 6px);min-height:100vh}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-size:20px;margin:0;letter-spacing:.02em}h1 span{color:var(--acc)}
.mu{color:var(--mu)}.sm{font-size:13px}
.now{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:22px;display:flex;align-items:center;gap:20px;margin-bottom:14px}
.big{font:800 64px/1 ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}
.dot{width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 #2fd27a88;animation:p 1.8s infinite;flex:none}
@keyframes p{to{box-shadow:0 0 0 14px #2fd27a00}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px}
.c b{display:block;font:700 28px/1.1 ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums;margin-top:4px}
.sec{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:16px;margin-bottom:14px}
.sec h2{font-size:14px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu)}
.bars{display:flex;align-items:flex-end;gap:5px;height:130px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bar i{display:block;width:100%;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.bar.hj i{background:#ff3b2f}
.bar small{font-size:10px;color:var(--mu)}.bar em{font-style:normal;font-size:11px;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.meter{height:8px;background:#ffffff14;border-radius:8px;overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;background:var(--acc)}
form{display:flex;gap:8px;margin-top:12px}
input{flex:1;min-width:0;background:#0b0b10;border:1px solid var(--ln);color:var(--tx);border-radius:10px;padding:12px;font:inherit}
button{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:12px 16px;font:600 15px system-ui,sans-serif;cursor:pointer}
button.gh{background:transparent;border:1px solid var(--ln);color:var(--mu);padding:8px 12px;font-size:13px}
.err{color:#ff6b62;margin-top:10px}
</style></head><body><main>
<header><h1>Box <span>RC Life</span></h1><button class="gh" id="out" hidden>Sair</button></header>
<div id="v"></div>
<div id="as"></div>
</main>
<script>
const URL_W='https://habit-rc-avisos.sdouglaslisciocardoso.workers.dev/painel';
const $=s=>document.querySelector(s),v=$('#v');
const ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,x)=>{try{x==null?localStorage.removeItem(k):localStorage.setItem(k,x)}catch(e){}}};
let K=ls.g('rcpk')||'';
const h=location.hash.match(/k=([a-f0-9]+)/);if(h){K=h[1];ls.s('rcpk',K);history.replaceState(null,'',location.pathname)}
const n=x=>Number(x||0).toLocaleString('pt-BR');
const dd=s=>{const[y,m,d]=s.split('-');return d+'/'+m};
function login(msg){$('#out').hidden=true;$('#as').innerHTML='';v.innerHTML=`<div class="sec"><h2>Acesso do dono</h2><p class="mu sm">Digite o código de acesso do painel. Ele fica salvo só neste aparelho.</p><form id="f"><input id="k" type="password" autocomplete="current-password" placeholder="Código de acesso"><button>Entrar</button></form>${msg?`<p class="err">${msg}</p>`:''}</div>`;$('#f').onsubmit=e=>{e.preventDefault();K=$('#k').value.trim();if(!K)return;ls.s('rcpk',K);load()}}
let tm;
async function load(){clearTimeout(tm);if(!K)return login();
 try{const r=await fetch(URL_W,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({k:K}),cache:'no-store'});const j=await r.json();
  if(r.status==401){K='';ls.s('rcpk',null);return login(j.erro||'Código inválido.')}
  if(!r.ok)throw new Error(j.erro||r.status);draw(j);if(!$('#as').innerHTML)assLoad()}
 catch(e){if(!v.innerHTML)v.innerHTML='';const p=document.createElement('p');p.className='err';p.textContent='Sem conexão com o servidor agora. Tentando de novo…';if(!$('.err'))v.prepend(p)}
 tm=setTimeout(load,20000)}
function draw(j){$('#out').hidden=false;
 const days=[];for(let i=13;i>=0;i--){const t=new Date(j.ts-3*36e5-i*864e5).toISOString().slice(0,10);days.push(t)}
 const S=Object.fromEntries((j.serie||[]).map(x=>[x.dy,x.c])),N=Object.fromEntries((j.novosSerie||[]).map(x=>[x.dy,x.c])),mx=Math.max(1,...days.map(d=>S[d]||0));
 const P={ios:'iPhone',android:'Android',desktop:'Computador',outro:'Outro'};const pl={};let inst=0,tot7=0;(j.plat||[]).forEach(x=>{pl[x.p]=(pl[x.p]||0)+x.c;tot7+=x.c;if(x.i)inst+=x.c});
 const iaPct=Math.min(100,Math.round((j.ia||0)/(j.iaLim||1)*100));
 v.innerHTML=`<div class="now"><span class="dot"></span><div><div class="big">${n(j.agora)}</div><div class="mu">${j.agora==1?'pessoa usando agora':'pessoas usando agora'}</div></div></div>
 <div class="grid">
  <div class="c"><span class="mu sm">Últimos 15 min</span><b>${n(j.h15)}</b></div>
  <div class="c"><span class="mu sm">Última hora</span><b>${n(j.h1)}</b></div>
  <div class="c"><span class="mu sm">Hoje</span><b>${n(j.hoje)}</b></div>
  <div class="c"><span class="mu sm">Novos hoje</span><b>${n(j.novos)}</b></div>
  <div class="c"><span class="mu sm">7 dias</span><b>${n(j.d7)}</b></div>
  <div class="c"><span class="mu sm">30 dias</span><b>${n(j.d30)}</b></div>
  <div class="c"><span class="mu sm">Aparelhos no total</span><b>${n(j.total)}</b></div>
  <div class="c"><span class="mu sm">Visitas no total</span><b>${n(j.visitas)}</b></div>
  <div class="c"><span class="mu sm">Contas criadas</span><b>${n(j.contas)}</b></div>
  <div class="c"><span class="mu sm">Sincronizaram (24h)</span><b>${n(j.sinc)}</b></div>
 </div>
 <div class="sec"><h2>Pessoas por dia · 14 dias</h2><div class="bars">${days.map((d,i)=>{const c=S[d]||0;return`<div class="bar ${i==13?'hj':''}" title="${dd(d)}: ${c} pessoas, ${N[d]||0} novas"><em>${c||''}</em><i style="height:${Math.round(c/mx*100)}%"></i><small>${dd(d).slice(0,2)}</small></div>`}).join('')}</div></div>
 <div class="sec"><h2>Aparelhos · 7 dias</h2>${Object.keys(pl).sort((a,b)=>pl[b]-pl[a]).map(k=>`<div class="row"><span>${P[k]||k}</span><span>${n(pl[k])}</span></div>`).join('')||'<p class="mu sm">Ninguém ainda.</p>'}${tot7?`<div class="row"><span>Com o app instalado</span><span>${n(inst)} de ${n(tot7)}</span></div>`:''}</div>
 <div class="sec"><h2>IA do app · hoje</h2>${j.iaOn?`<div class="row"><span>Pedidos de IA</span><span>${n(j.ia)} de ${n(j.iaLim)}</span></div><div class="meter"><i style="width:${iaPct}%"></i></div>${(j.iaMes||[]).map(m=>`<div class="row"><span>IA em ${m.mes.slice(5)}/${m.mes.slice(0,4)}</span><span>${n(m.n)} pedidos · ${(m.ent/1e6).toFixed(2)} mi tokens de entrada · ${(m.sai/1e6).toFixed(2)} mi de saída</span></div>`).join('')}<p class="mu sm">Custo real em console.anthropic.com > Usage. Divida pelo número de assinantes para ver se a conta fecha.</p>`:'<p class="mu sm">Desligada. Para ligar, crie o secret ANTHROPIC_KEY no Worker do Cloudflare.</p>'}</div>
 <p class="mu sm">Atualiza sozinho a cada 20 segundos · ${new Date(j.ts).toLocaleTimeString('pt-BR')}. "Agora" conta quem está com o app aberto nos últimos 2 minutos. Tudo anônimo: nenhum nome ou dado pessoal é enviado.</p>`}
/* assinaturas da IA: o dono marca quem pagou (por e-mail da conta Google) */
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const assPost=b=>fetch(URL_W,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.assign({k:K},b)),cache:'no-store'}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.erro||r.status);return j});
async function assLoad(msg){const a=$('#as');if(!K){a.innerHTML='';return}
 let j;try{j=await assPost({acao:'assLista'})}catch(e){a.innerHTML=`<div class="sec"><h2>Assinaturas da IA</h2><p class="err">${esc(e.message)}</p></div>`;return}
 const L=j.lista||[],at=L.filter(x=>x.ativa).length;
 a.innerHTML=`<div class="sec"><h2>Assinaturas da IA</h2>
 <p class="mu sm">${j.plano=='assinatura'?'<b style="color:var(--tx)">Cobrança ligada:</b> só assinantes usam a IA.':'<b style="color:var(--tx)">Cobrança desligada:</b> a IA está liberada para todos. Para exigir assinatura, crie a variável <b>PLANO_IA</b> = <b>assinatura</b> no Worker.'} ${at} ${at==1?'assinatura ativa':'assinaturas ativas'}.</p>
 <form id="af"><input id="aem" type="email" placeholder="E-mail da conta Google" autocomplete="off" required><input id="adi" type="number" min="0" max="3660" value="30" style="flex:0 0 90px" aria-label="Dias"><button>Dar dias</button></form>
 <p class="mu sm">Os dias somam ao que a pessoa já tem. Use 0 para cancelar. A pessoa precisa ter entrado no app com o Google pelo menos uma vez.</p>
 ${msg?`<p class="sm" style="color:var(--ok)">${esc(msg)}</p>`:''}<p class="err" id="aer" hidden></p>
 ${L.map(x=>`<div class="row"><span>${esc(x.nm||x.em)}<br><small class="mu">${esc(x.em)}${x.obs?' · '+esc(x.obs):''}</small></span><span style="text-align:right">${x.ativa?'até '+new Date(x.ate).toLocaleDateString('pt-BR'):'<span class="mu">vencida</span>'}</span></div>`).join('')||'<p class="mu sm">Ninguém assinou ainda.</p>'}</div>`;
 $('#af').onsubmit=async e=>{e.preventDefault();const em=$('#aem').value.trim(),dias=+$('#adi').value,er=$('#aer');er.hidden=true;
  try{const r=await assPost({acao:'ass',em,dias});assLoad(dias?`${em}: assinatura até ${new Date(r.ate).toLocaleDateString('pt-BR')}.`:`${em}: assinatura cancelada.`)}catch(x){er.textContent=x.message;er.hidden=false}}}
$('#out').onclick=()=>{K='';ls.s('rcpk',null);$('#as').innerHTML='';login()};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
load();
</script></body></html>
